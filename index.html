  var arr = new Array(cap).fill(0);
  var top = -1;
  push(0, "空栈，先从栈底开始放", [{t:"arrInit", values:arr.slice()}]);
  for(var i=0;i<ops.length;i++){
    var op = ops[i];
    if(op > 0){
      top++;
      arr[top] = op;
      push(2, "push " + op + "：放到栈顶（下标 " + top + "）",
           [{t:"setMain", i:top, v:op}, {t:"ptr", name:"top", i:top}]);
    }else{
      if(top < 0){ push(3, "栈已经空了，pop 无事发生"); continue; }
      push(3, "pop：弹出栈顶 " + arr[top], [{t:"found", i:top}]);
      arr[top] = 0;
      push(3, "栈顶清空，指针下移", [{t:"setMain", i:top, v:0}]);
      top--;
      push(3, "现在栈顶是 " + (top >= 0 ? arr[top] : "空"), [{t:"ptr", name:"top", i:top}]);
    }
  }
  push(5, "最后栈里（从底到顶）：" + (top >= 0 ? arr.slice(0, top+1).join(" ") : "空"), []);
  return steps;
}

function simBits(data){
  var steps = [];
  function push(line, note, events){ steps.push({line:line, note:note||"", events:events||[]}); }
  var x = (data && data.x) || 13;
  var bits = binBits(x);
  var c = 0;
  push(0, "x = " + x + "，二进制 " + x.toString(2) + "，最低位在右边",
       [{t:"bitsInit", bits:bits, title:"x = " + x}, {t:"var", k:"count", v:0}]);
  while(x){
    var low = x & -x;
    var idx = Math.round(Math.log(low) / Math.LN2);
    x &= x - 1;
    bits[idx] = 0;
    c++;
    push(3, "x &= x - 1：清掉最低位的 1（第 " + idx + " 位），x 变成 " + x + "，计数 " + c,
         [{t:"bitHi", i:idx}, {t:"bitSet", i:idx, v:0}, {t:"var", k:"count", v:c}]);
  }
  push(5, "一共 " + c + " 个 1", [{t:"var", k:"count", v:c}]);
  return steps;
}

function simPow(data){
  var steps = [];
  function push(line, note, events){ steps.push({line:line, note:note||"", events:events||[]}); }
  var a = (data && data.a) || 3;
  var b = (data && data.b) || 13;
  var mod = (data && data.mod) || 1000;
  var r = 1;
  push(0, "算 " + a + "^" + b + " mod " + mod + "，b 的二进制是 " + b.toString(2),
       [{t:"bitsInit", bits:binBits(b), title:"b = " + b},
        {t:"var", k:"a", v:a}, {t:"var", k:"r", v:1}, {t:"var", k:"b", v:b}]);
  while(b){
    push(2, "看 b 的最低位：" + (b & 1), [{t:"bitHi", i:0}]);
    if(b & 1){
      r = r * a % mod;
      push(3, "这一位是 1：r = r × a mod " + mod + " = " + r, [{t:"var", k:"r", v:r}]);
    }
    a = a * a % mod;
    push(4, "a 平方后变成 " + a, [{t:"var", k:"a", v:a}]);
    b >>= 1;
    push(5, "b 右移一位 = " + b, [{t:"bitsInit", bits:binBits(b), title:"b = " + b},
         {t:"var", k:"b", v:b}]);
  }
  push(7, "答案 " + r, [{t:"var", k:"r", v:r}]);
  return steps;
}

function simHash(data){
  var steps = [];
  function push(line, note, events){ steps.push({line:line, note:note||"", events:events||[]}); }
  var m = (data && data.m) || 7;
  var keys = (data && data.keys) || [15,11,27,8,12,20];
  var buckets = [];
  for(var i=0;i<m;i++) buckets.push([]);
  push(0, "开 " + m + " 个桶，哈希函数是 x % " + m, [{t:"hashInit", m:m}]);
  for(var k=0;k<keys.length;k++){
    var key = keys[k], b = key % m;
    push(3, "插入 " + key + "：hash = " + key + " % " + m + " = " + b, [{t:"hashHi", b:b}]);
    if(buckets[b].length){
      push(4, "桶 " + b + " 里已经有 " + buckets[b].join("、") + "，冲突，挂到链表后面");
    }
    buckets[b].push(key);
    push(5, "桶 " + b + " 现在是：" + buckets[b].join(" → "), [{t:"hashPush", b:b, v:key}]);
  }
  var parts = [];
  for(var b2=0;b2<m;b2++) if(buckets[b2].length) parts.push(b2 + ": " + buckets[b2].join("→"));
  push(9, "装好了 —— " + parts.join("　"), []);
  return steps;
}

function simPerm(data){
  var steps = [];
  function push(line, note, events){ steps.push({line:line, note:note||"", events:events||[]}); }
  var n = (data && data.n) || 3;
  var path = [], used = {}, count = 0;
  var zeros = [];
  for(var i=0;i<n;i++) zeros.push(0);
  push(0, "从空排列开始，一位一位往下选", [{t:"arrInit", values:zeros.slice()}]);
  function dfs(dep){
    push(2, "dfs(" + dep + ")：现在排到第 " + dep + " 位", [{t:"callPush", name:"dfs(" + dep + ")"}]);
    if(dep === n){
      count++;
      push(3, "得到一个排列：" + path.join(" "), [{t:"perm", arr:path.slice()}]);
      push(2, "返回上一层", [{t:"callPop"}]);
      return;
    }
    for(var v=1; v<=n; v++){
      if(used[v]) continue;
      used[v] = true; path.push(v);
      push(6, "选 " + v + "：path = " + path.join(" "),
           [{t:"setMain", i:dep, v:v}, {t:"cur", u:0}]);
      dfs(dep + 1);
      path.pop(); used[v] = false;
      push(8, "撤销 " + v + "（回溯），path = " + (path.length ? path.join(" ") : "空"),
           [{t:"setMain", i:dep, v:0}]);
    }
    push(2, "没有可选的数了，返回上一层", [{t:"callPop"}]);
  }
  dfs(0);
  push(10, "一共 " + count + " 个排列", []);
  return steps;
}

function simFact(data){
  var steps = [];
  function push(line, note, events){ steps.push({line:line, note:note||"", events:events||[]}); }
  var n = (data && data.n) || 5;
  var slots = new Array(n).fill(0);
  push(0, "求 " + n + "!，每深入一层就乘上当前的 n", [{t:"arrInit", values:slots.slice()}]);
  function f(k, dep){
    push(0, "进入 fact(" + k + ")", [{t:"callPush", name:"fact(" + k + ")"}]);
    if(k <= 1){
      slots[dep] = 1;
      push(1, "fact(1) = 1，开始往回乘", [{t:"setMain", i:dep, v:1}, {t:"callPop"}]);
      return 1;
    }
    var r = k * f(k - 1, dep + 1);
    slots[dep] = r;
    push(2, "回来算 " + k + " × " + (r / k) + " = " + r, [{t:"setMain", i:dep, v:r}]);
    push(2, "fact(" + k + ") 返回 " + r, [{t:"callPop"}]);
    return r;
  }
  var ans = f(n, 0);
  push(4, "答案 " + n + "! = " + ans, [{t:"found", i:0}]);
  return steps;
}

function simArrange(data){
  var steps = [];
  function push(line, note, events){ steps.push({line:line, note:note||"", events:events||[]}); }
  var n = (data && data.n) || 5;
  var k = (data && data.k) || 3;
  var a = [], aux = [];
  for(var i=0;i<k;i++) a.push(n - i);
  push(0, "A(" + n + "," + k + ") = 从 " + n + " 开始连乘 " + k + " 个数",
       [{t:"arrInit", values:a.slice()}, {t:"auxInit", n:k}]);
  var r = 1;
  for(var i=0;i<k;i++){
    r *= a[i];
    aux.push({t:"auxSet", i:i, v:r});
    push(2, "乘上 " + a[i] + "，结果 = " + r, [{t:"cmp", i:i, j:i}].concat(aux.slice()));
  }
  push(5, "A(" + n + "," + k + ") = " + r, [{t:"found", i:k-1}]);
  return steps;
}

function buildSteps(lesson, g, arr){
  if(lesson.kind === "bubble") return simBubble(arr);
  if(lesson.kind === "binary") return simBinary(arr);
  if(lesson.kind === "quick")  return simQuick(arr);
  if(lesson.kind === "merge")  return simMerge(arr);
  if(lesson.kind === "prefix") return simPrefix(arr);
  if(lesson.kind === "diff")   return simDiff(arr);
  if(lesson.kind === "knap01")   return simKnap(arr, false);
  if(lesson.kind === "knapfull") return simKnap(arr, true);
  if(lesson.kind === "mono")     return simMono(arr);
  if(lesson.kind === "heap")     return simHeap(arr);
  if(lesson.kind === "memo")     return simMemo(arr);
  if(lesson.kind === "floyd")    return simFloyd(arr);
  if(lesson.kind === "bit")      return simBit(arr);
  if(lesson.kind === "seg")      return simSeg(arr);
  if(lesson.kind === "trie")     return simTrie(arr);
  if(lesson.kind === "idp")      return simIdp(arr);
  if(lesson.kind === "kmp")      return simKmp(arr);
  if(lesson.kind === "store") return simStore(g, lesson.mode);
  if(lesson.kind === "dfs") return simDFS(g);
  if(lesson.kind === "dij") return simDijkstra(g);
  if(lesson.kind === "bell") return simBell(g);
  if(lesson.kind === "spfa") return simSpfa(g);
  if(lesson.kind === "prim") return simPrim(g);
  if(lesson.kind === "bip") return simBip(g);
  if(lesson.kind === "scc") return simScc(g);
  if(lesson.kind === "flow") return simFlow(g);
  if(lesson.kind === "dsu") return simDsu(g);
  if(lesson.kind === "recur") return simRecur(arr);
  if(lesson.kind === "rob") return simRob(arr);
  if(lesson.kind === "twoptr") return simTwoPtr(arr);
  if(lesson.kind === "slide") return simSlide(arr);
  if(lesson.kind === "sieve") return simSieve(arr);
  if(lesson.kind === "lis") return simLis(arr);
  if(lesson.kind === "lcs") return simLcs(arr);
  if(lesson.kind === "mknap") return simMknap(arr);
  if(lesson.kind === "gantt") return simGantt(arr);
  if(lesson.kind === "binans") return simBinAns(arr);
  if(lesson.kind === "pascal") return simPascal(arr);
  if(lesson.kind === "stack") return simStack(arr);
  if(lesson.kind === "bits") return simBits(arr);
  if(lesson.kind === "pow") return simPow(arr);
  if(lesson.kind === "hash") return simHash(arr);
  if(lesson.kind === "perm") return simPerm(arr);
  if(lesson.kind === "fact") return simFact(arr);
  if(lesson.kind === "arrange") return simArrange(arr);
  if(lesson.kind === "kru") return simKruskal(g);
  if(lesson.kind === "topo") return simTopo(g);
  return simBFS(g);
}

/* =========================================================
   4. 状态与事件
   ========================================================= */

function makeState(lesson, g, arr){
  var st = {
    n: 0, edges: [],
    adj: new Map(), matrix: null,
    head: null, to: [0], wt: [0], nxt: [0], tot: 0, pendingU: 0,
    visited: new Set(), order: [], dist: new Map(),
    dfs: [], queue: [], heap: [], settled: new Set(), stats: {},
    dsuParent: new Map(), dsuSize: new Map(), kruStatus: {}, mst: new Set(),
    mstWeight: 0, curEdge: null, sortedList: [], indeg: new Map(),
    arr: [], cmp: null, swap: null, sortedIdx: new Set(), window: null,
    ptrs: {}, pivot: null, found: null, ranges: [], target: null,
    aux: [], auxHi: -1, auxHi2: -1, query: null,
    mstack: [], ans: new Map(),
    harr: [], hcur: 0, calls: [], round: 0, colors: new Map(), lows: new Map(),
    flow: new Map(), maxflow: 0, dimSet: new Set(),
    gitems: [], gpicked: new Set(), gcur: -1,
    bits: [], bitHi: -1, bitTitle: "", vars: {},
    buckets: [], hashHi: -1, perms: [],
    topArr: [], patArr: [], nxtArr: [], ti: -1, pj: 0, hit: -1, topIsText: false,
    tr: {}, curP: 0, marks: {},
    nodes: [], curNode: 0,
    grid: null, dpRows: 0, dpCols: 0, focus: null, deps: [], cellHit: null,
    cur: null, hi: null
  };
  if(lesson.view === "array"){
    if(arr && arr.values) st.arr = arr.values.slice();
    if(arr) st.target = arr.target;
    st.n = st.arr.length;
    return st;
  }
  if(lesson.kind !== "store"){
    st.n = g.n;
    st.adj = buildAdj(g);
    st.matrix = zeros(g.n);
    st.head = new Array(g.n + 1).fill(-1);
    for(var i=0;i<g.edges.length;i++){
      st.edges.push({u:g.edges[i][0], v:g.edges[i][1], w:g.edges[i][2]});
    }
  }
  if(lesson.kind === "dij" || lesson.kind === "bell" || lesson.kind === "spfa" || lesson.kind === "prim"){
    for(var v=1; v<=g.n; v++) st.dist.set(v, Infinity);
  }
  if(lesson.kind === "scc"){
    for(var v=1; v<=g.n; v++) st.dist.set(v, 0);
  }
  if(lesson.kind === "kru"){
    st.sortedList = g.edges.map(function(e, i){ return {u:e[0], v:e[1], w:e[2], idx:i}; })
      .sort(function(a,b){ return a.w - b.w || a.idx - b.idx; });
  }
  return st;
}

function applyEvents(st, evs){
  for(var k=0;k<evs.length;k++){
    var e = evs[k];
    switch(e.t){
      case "n":
        st.n = e.n;
        st.adj = new Map();
        for(var i=1;i<=e.n;i++) st.adj.set(i, []);
        st.matrix = zeros(e.n);
        st.head = new Array(e.n + 1).fill(-1);
        break;
      case "edge":
        st.edges.push({u:e.u, v:e.v, w:e.w});
        break;
      case "adjPush":
        st.adj.get(e.u).push({v:e.v, w:e.w});
        break;
      case "matSet":
        st.matrix[e.u][e.v] = e.w;
        break;
      case "fsNew":
        st.tot++;
        st.to[st.tot] = e.v;
        st.wt[st.tot] = e.w;
        st.nxt[st.tot] = -1;
        st.pendingU = e.u;
        break;
      case "fsNxt":
        st.nxt[st.tot] = st.head[st.pendingU];
        break;
      case "fsHead":
        st.head[e.u] = st.tot;
        break;
      case "visit":
        if(!st.visited.has(e.u)){ st.visited.add(e.u); st.order.push(e.u); }
        break;
      case "enter":
        st.dfs.push({u:e.u, i:-1, v:null});
        st.cur = e.u;
        break;
      case "iter":
        var f = st.dfs[st.dfs.length-1];
        if(f){ f.i = e.i; f.v = e.v; }
        break;
      case "exit":
        st.dfs.pop();
        st.cur = st.dfs.length ? st.dfs[st.dfs.length-1].u : null;
        break;
      case "qpush":
        st.queue.push(e.u);
        break;
      case "qpop":
        st.queue.shift();
        break;
      case "dist":
        st.dist.set(e.u, e.val);
        break;
      case "round":
        st.round = e.i;
        break;
      case "color":
        st.colors.set(e.u, e.c);
        break;
      case "low":
        st.lows.set(e.u, e.v);
        break;
      case "flow":
        st.flow.set(edgeKey(e.u, e.v), e.f);
        break;
      case "mflow":
        st.maxflow = e.v;
        break;
      case "dim":
        st.dimSet.add(e.i);
        break;
      case "ganttInit":
        st.gitems = e.items;
        st.gpicked = new Set();
        st.gcur = -1;
        break;
      case "ganttCur":
        st.gcur = e.i;
        break;
      case "ganttPick":
        st.gpicked.add(e.i);
        break;
      case "bitsInit":
        st.bits = e.bits.slice();
        if(e.title !== undefined) st.bitTitle = e.title;
        st.bitHi = -1;
        break;
      case "bitHi":
        st.bitHi = e.i;
        break;
      case "bitSet":
        if(st.bits[e.i] !== undefined) st.bits[e.i] = e.v;
        break;
      case "var":
        st.vars[e.k] = e.v;
        break;
      case "hashInit":
        st.buckets = [];
        for(var hb=0; hb<e.m; hb++) st.buckets.push([]);
        st.hashHi = -1;
        break;
      case "hashHi":
        st.hashHi = e.b;
        break;
      case "hashPush":
        if(st.buckets[e.b]) st.buckets[e.b].push(e.v);
        break;
      case "perm":
        st.perms.push(e.arr.slice());
        break;
      case "cur":
        st.cur = e.u;
        break;
      case "hi":
        st.hi = e.hi;
        break;
      case "settle":
        st.settled.add(e.u);
        break;
      case "hp":
        st.heap.push({d:e.d, u:e.u});
        st.heap.sort(function(a,b){ return a.d - b.d || a.u - b.u; });
        break;
      case "hpPop":
        st.heap.shift();
        break;
      case "stat":
        st.stats[e.k] = (st.stats[e.k] || 0) + (e.n || 1);
        break;
      case "dsuInit":
        for(var d=1; d<=e.n; d++){ st.dsuParent.set(d, d); st.dsuSize.set(d, 1); }
        break;
      case "setParent":
        st.dsuParent.set(e.x, e.p);
        break;
      case "setSize":
        st.dsuSize.set(e.x, e.s);
        break;
      case "curEdge":
        st.curEdge = { i:e.i, u:e.u, v:e.v, w:e.w };
        break;
      case "mstAdd":
        st.kruStatus[e.i] = "mst";
        st.mst.add(edgeKey(e.u, e.v));
        st.mstWeight += e.w;
        break;
      case "kruSkip":
        st.kruStatus[e.i] = "skip";
        break;
      case "deg":
        st.indeg.set(e.u, e.v);
        break;
      case "spush":
        st.mstack.push(e.i);
        break;
      case "spop":
        st.mstack.pop();
        break;
      case "ans":
        st.ans.set(e.i, e.v);
        break;
      case "hinit":
        st.harr = [0];
        break;
      case "hpush":
        st.harr.push(e.v);
        break;
      case "hswap":
        var hv = st.harr[e.i]; st.harr[e.i] = st.harr[e.j]; st.harr[e.j] = hv;
        break;
      case "hcur":
        st.hcur = e.i;
        break;
      case "callPush":
        st.calls.push(e.n);
        st.found = null;
        break;
      case "callPop":
        st.calls.pop();
        break;
      case "strInit":
        st._text = String(e.text);
        st._pat = String(e.pat);
        st.patArr = st._pat.split("");
        st.topArr = st._pat.split("");
        st.nxtArr = new Array(st.patArr.length).fill(null);
        st.ti = 0; st.pj = 0; st.hit = -1; st.topIsText = false;
        break;
      case "top":
        st.topArr = (e.which === "s" ? st._text : st._pat).split("");
        st.topIsText = (e.which === "s");
        break;
      case "nxtSet":
        st.nxtArr[e.i] = e.v;
        break;
      case "pos":
        st.ti = e.i; st.pj = e.j;
        break;
      case "hit":
        st.hit = e.start;
        break;
      case "segInit":
        st.tr = {}; st.curP = 0; st.marks = {};
        break;
      case "segNode":
        st.tr[e.p] = { l:e.l, r:e.r, v:e.v };
        break;
      case "segCur":
        st.curP = e.p;
        break;
      case "segMark":
        st.marks[e.p] = e.k;
        break;
      case "segClear":
        st.marks = {};
        break;
      case "trieInit":
        st.nodes = [{ id:0, ch:"", parent:-1, end:false }];
        st.curNode = 0;
        break;
      case "trieNode":
        st.nodes.push({ id:e.id, ch:e.ch, parent:e.parent, end:false });
        break;
      case "trieCur":
        st.curNode = e.id;
        break;
      case "trieEnd":
        if(st.nodes[e.id]) st.nodes[e.id].end = true;
        break;
      case "arrInit":
        st.arr = e.values.slice();
        break;
      case "target":
        st.target = e.v;
        break;
      case "cmp":
        st.cmp = [e.i, e.j];
        st.swap = null;
        break;
      case "swap":
        var tv = st.arr[e.i]; st.arr[e.i] = st.arr[e.j]; st.arr[e.j] = tv;
        st.swap = [e.i, e.j];
        st.cmp = null;
        break;
      case "sorted":
        st.sortedIdx.add(e.i);
        break;
      case "window":
        st.window = (e.lo === null || e.lo === undefined) ? null : [e.lo, e.hi];
        break;
      case "ptr":
        st.ptrs[e.name] = e.i;
        break;
      case "pivot":
        st.pivot = (e.i === -1 ? null : e.i);
        break;
      case "found":
        st.found = e.i;
        break;
      case "rpush":
        st.ranges.push({l:e.lo, r:e.hi});
        st.window = [e.lo, e.hi];
        break;
      case "rpop":
        st.ranges.pop();
        st.window = st.ranges.length ? [st.ranges[st.ranges.length-1].l, st.ranges[st.ranges.length-1].r] : null;
        break;
      case "clear":
        st.cmp = null; st.swap = null; st.auxHi = -1;
        break;
      case "auxInit":
        st.aux = new Array(e.n).fill(null);
        break;
      case "auxSet":
        st.aux[e.i] = e.v;
        st.auxHi = e.i;
        st.auxHi2 = -1;
        break;
      case "auxMark":
        st.auxHi = e.a;
        st.auxHi2 = e.b;
        break;
      case "query":
        st.query = { l:e.l, r:e.r, v:e.v };
        break;
      case "gridInit":
        st.dpRows = e.rows; st.dpCols = e.cols;
        st.grid = [];
        for(var r=0; r<e.rows; r++){
          var row = [];
          for(var c=0; c<e.cols; c++) row.push(null);
          st.grid.push(row);
        }
        break;
      case "cell":
        st.grid[e.i][e.j] = e.v;
        st.cellHit = [e.i, e.j];
        break;
      case "focus":
        st.focus = [e.i, e.j];
        st.cellHit = null;
        break;
      case "deps":
        st.deps = e.cells || [];
        break;
      case "dpClear":
        st.focus = null; st.deps = []; st.cellHit = null;
        break;
      case "setMain":
        st.arr[e.i] = e.v;
        break;
    }
  }
}

function stateAt(lesson, g, arr, steps, k){
  var st = makeState(lesson, g, arr);
  for(var i=0;i<=k && i<steps.length;i++) applyEvents(st, steps[i].events);
  return st;
}

function freshFromStep(step){
  var r = { edge:null, chip:null, mat:null, fs:false, dist:null };
  if(!step) return r;
  for(var i=0;i<step.events.length;i++){
    var e = step.events[i];
    if(e.t === "edge") r.edge = edgeKey(e.u, e.v);
    if(e.t === "adjPush") r.chip = e.u + "-" + e.v;
    if(e.t === "matSet") r.mat = e.u + "-" + e.v;
    if(e.t === "fsNew" || e.t === "fsNxt" || e.t === "fsHead") r.fs = true;
    if(e.t === "dist") r.dist = e.u;
  }
  return r;
}

function renderHeap(st, lesson){
  var svg = document.getElementById("graph");
  var W = 620, H = 500;
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  var h = st.harr || [];
  if(h.length < 2){
    svg.innerHTML = '<text class="muted" x="' + (W/2) + '" y="' + (H/2) + '" text-anchor="middle">等待插入元素…</text>';
    return;
  }
  var n = h.length - 1;
  var P = 34, top = 52;
  var maxD = Math.floor(Math.log(n) / Math.LN2);
  var levelH = Math.min(84, (H - 200) / Math.max(1, maxD + 1));
  var out = "";

  function pos(i){
    var d = Math.floor(Math.log(i) / Math.LN2);
    var cnt = Math.pow(2, d);
    var idx = i - cnt;
    var x = P + (idx + 0.5) * (W - 2*P) / cnt;
    var y = top + d * levelH;
    return [x, y];
  }

  for(var i=2;i<=n;i++){
    var a = pos(i), b = pos(i >> 1);
    out += '<line class="edge" x1="' + b[0] + '" y1="' + b[1] + '" x2="' + a[0] + '" y2="' + a[1] + '"/>';
  }
  for(var i=1;i<=n;i++){
    var p = pos(i);
    out += '<circle class="hnode' + (st.hcur === i ? " cur" : "") + '" cx="' + p[0] + '" cy="' + p[1] + '" r="18"/>';
    if(CAT.on) out += catEars(p[0], p[1], 18);
    out += '<text class="htext" x="' + p[0] + '" y="' + (p[1] + 5) + '" text-anchor="middle">' + h[i] + '</text>';
    out += '<text class="hidx" x="' + p[0] + '" y="' + (p[1] - 24) + '" text-anchor="middle">' + i + '</text>';
  }

  var cellW = (W - 2*P) / Math.max(n, 1);
  var y0 = H - 78;
  out += '<text class="rowlab" x="' + P + '" y="' + (y0 - 10) + '">数组 h[1..' + n + ']，父子关系：i 的父节点是 i/2</text>';
  for(var i=1;i<=n;i++){
    var x = P + (i-1) * cellW;
    out += '<rect class="acell' + (st.hcur === i ? " hit" : "") + '" x="' + x + '" y="' + y0 + '" width="' + (cellW - 4) + '" height="30" rx="4"/>';
    out += '<text class="alab" x="' + (x + (cellW-4)/2) + '" y="' + (y0 + 20) + '" text-anchor="middle">' + h[i] + '</text>';
    out += '<text class="hidx" x="' + (x + (cellW-4)/2) + '" y="' + (y0 + 44) + '" text-anchor="middle">' + i + '</text>';
  }
  svg.innerHTML = out;
}

function renderArray(st, lesson){
  var svg = document.getElementById("graph");
  var box = svg.getBoundingClientRect();
  var W = 620;
  var H = 380;
  if(box.width > 0 && box.height > 0){
    H = clamp(Math.round(W * box.height / box.width), 380, 600);
  }
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);

  var a = st.arr || [];
  if(!a.length){
    svg.innerHTML = '<text class="muted" x="' + (W/2) + '" y="' + (H/2) + '" text-anchor="middle">等待数据…</text>';
    return;
  }
  var P = 36, base = H - 62;
  var hasAux = st.aux && st.aux.length > 0;
  if(hasAux) base = H - 116;
  var n = a.length, max = 1;
  for(var i=0;i<n;i++) if(a[i] > max) max = a[i];
  var bw = (W - 2*P) / n;
  var barMax = hasAux ? (H - 200) : (H - 140);
  var out = "";

  for(var i=0;i<n;i++){
    var v = a[i];
    var h = Math.max(10, v / max * barMax);
    var w = bw * 0.62;
    var x = P + i*bw + (bw - w)/2;
    var y = base - h;
    var cls = "bar";
    if(st.sortedIdx.has(i)) cls += " sorted";
    if(st.pivot === i) cls += " pivot";
    if(st.cmp && (st.cmp[0] === i || st.cmp[1] === i)) cls += " cmp";
    if(st.swap && (st.swap[0] === i || st.swap[1] === i)) cls += " swap";
    if(st.found === i) cls += " found";
    if(st.window && (i < st.window[0] || i > st.window[1])) cls += " out";
    if(st.dimSet && st.dimSet.has(i)) cls += " out";
    out += '<rect class="' + cls + '" data-i="' + i + '" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="3"/>';
    if(CAT.on){
      var wigg = (st.swap && (st.swap[0] === i || st.swap[1] === i)) ? "wig" : "";
      out += catEars(x + w/2, y, Math.min(9.5, w * 0.36), wigg);
    }
    out += '<text class="vlab" x="' + (x+w/2) + '" y="' + (y - (CAT.on ? 21 : 7)) + '" text-anchor="middle">' + v + '</text>';
    out += '<text class="ilab" x="' + (x+w/2) + '" y="' + (base+16) + '" text-anchor="middle">' + i + '</text>';
  }

  var off = { lo:-11, hi:11, mid:0, i:-11, j:11 };
  var col = { lo:"#4cc9f0", hi:"#f4a261", mid:"#e8f4ff", i:"#4cc9f0", j:"#f4a261" };
  for(var name in st.ptrs){
    var idx = st.ptrs[name];
    if(idx < 0 || idx >= n) continue;
    var cx = P + idx*bw + bw/2 + (off[name] || 0);
    var c = col[name] || "#9fb2c6";
    out += '<path d="M' + (cx-5) + ' ' + (base+30) + ' L' + (cx+5) + ' ' + (base+30) + ' L' + cx + ' ' + (base+23) + ' Z" fill="' + c + '"/>';
    out += '<text class="plab" x="' + cx + '" y="' + (base+43) + '" text-anchor="middle" fill="' + c + '">' + name + '</text>';
  }
  // 临时数组 tmp[]
  if(hasAux){
    var cellY = H - 50, cellH = 24, cellW = bw * 0.62;
    var auxLab = lesson.kind === "prefix" ? "pre[] 前缀和"
               : (lesson.kind === "lis" || lesson.kind === "rob") ? "dp[]"
               : (lesson.kind === "bit") ? "t[] 树状数组" : "tmp[] 临时数组";
    out += '<text class="rowlab" x="' + P + '" y="' + (cellY - 8) + '">' + auxLab + '</text>';
    for(var i=0;i<st.aux.length;i++){
      var ax = P + i*bw + (bw - cellW)/2;
      var av = st.aux[i];
      var acls = "acell" + (av === null || av === undefined ? " empty" : "")
        + (st.auxHi === i ? " hit" : "") + (st.auxHi2 === i ? " hit2" : "");
      out += '<rect class="' + acls + '" x="' + ax + '" y="' + cellY + '" width="' + cellW + '" height="' + cellH + '" rx="4"/>';
      out += '<text class="alab" x="' + (ax + cellW/2) + '" y="' + (cellY + 17) + '" text-anchor="middle">'
           + (av === null || av === undefined ? "·" : av) + '</text>';
    }
  }
  svg.innerHTML = out;
}

function renderTrie(st, lesson){
  var svg = document.getElementById("graph");
  var W = 620, H = 420;
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  var nodes = st.nodes || [];
  if(nodes.length < 2){
    svg.innerHTML = '<text class="muted" x="' + (W/2) + '" y="' + (H/2) + '" text-anchor="middle">等待插入单词…</text>';
    return;
  }
  var kids = {};
  nodes.forEach(function(n){
    if(n.parent >= 0){ (kids[n.parent] = kids[n.parent] || []).push(n); }
  });
  var leafX = 0, pos = {}, maxD = 0;
  function dfs(id, depth){
    maxD = Math.max(maxD, depth);
    var ch = kids[id] || [];
    var x;
    if(!ch.length){
      x = leafX++;
    }else{
      var xs = ch.map(function(c){ return dfs(c.id, depth + 1); });
      x = (Math.min.apply(null, xs) + Math.max.apply(null, xs)) / 2;
    }
    pos[id] = { x:x, y:depth };
    return x;
  }
  dfs(0, 0);
  var levelH = (H - 110) / Math.max(1, maxD);
  var cols = Math.max(1, leafX);
  function PX(x){ return 40 + (x + 0.5) * (W - 80) / cols; }
  function PY(d){ return 54 + d * levelH; }

  var out = "";
  nodes.forEach(function(n){
    if(n.parent < 0) return;
    var a = pos[n.id], b = pos[n.parent];
    out += '<line class="cedge" x1="' + PX(b.x) + '" y1="' + PY(b.y) + '" x2="' + PX(a.x) + '" y2="' + PY(a.y) + '"/>';
  });
  nodes.forEach(function(n){
    var p = pos[n.id];
    var cls = "tnode" + (st.curNode === n.id ? " cur" : "") + (n.end ? " end" : "");
    out += '<g class="' + cls + '"><circle cx="' + PX(p.x) + '" cy="' + PY(p.y) + '" r="15"/>'
        + (CAT.on ? catEars(PX(p.x), PY(p.y), 15) : '')
        + '<text x="' + PX(p.x) + '" y="' + (PY(p.y) + 4) + '" text-anchor="middle">'
        + (n.parent < 0 ? "R" : esc(n.ch)) + '</text>'
        + (n.end ? '<circle class="endring" cx="' + PX(p.x) + '" cy="' + PY(p.y) + '" r="19"/>' : '')
        + '</g>';
  });
  svg.innerHTML = out;
}

function renderSeg(st, lesson){
  var svg = document.getElementById("graph");
  var W = 620, H = 420;
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  var keys = Object.keys(st.tr || {});
  if(!keys.length){
    svg.innerHTML = '<text class="muted" x="' + (W/2) + '" y="' + (H/2) + '" text-anchor="middle">等待建树…</text>';
    return;
  }
  var maxD = 0;
  keys.forEach(function(k){ maxD = Math.max(maxD, Math.floor(Math.log(+k) / Math.LN2)); });
  var levelH = (H - 80) / Math.max(1, maxD);
  function px(p){
    var d = Math.floor(Math.log(p) / Math.LN2);
    var cnt = Math.pow(2, d);
    var idx = p - cnt;
    return [30 + (idx + 0.5) * (W - 60) / cnt, 46 + d * levelH];
  }
  var out = "";
  keys.forEach(function(k){
    var p = +k;
    if(p === 1 || !st.tr[p >> 1]) return;
    var a = px(p), b = px(p >> 1);
    out += '<line class="cedge" x1="' + b[0] + '" y1="' + b[1] + '" x2="' + a[0] + '" y2="' + a[1] + '"/>';
  });
  keys.forEach(function(k){
    var p = +k;
    var node = st.tr[p];
    var xy = px(p);
    var cls = "snode";
    if(st.curP === p) cls += " cur";
    if(st.marks && st.marks[p] === "full") cls += " full";
    if(st.marks && st.marks[p] === "part") cls += " part";
    out += '<g class="' + cls + '"><circle cx="' + xy[0] + '" cy="' + xy[1] + '" r="17"/>'
        + (CAT.on ? catEars(xy[0], xy[1], 17) : '')
        + '<text class="sval" x="' + xy[0] + '" y="' + (xy[1] + 4) + '" text-anchor="middle">' + node.v + '</text>'
        + '<text class="srange" x="' + xy[0] + '" y="' + (xy[1] - 23) + '" text-anchor="middle">[' + node.l + ',' + node.r + ']</text></g>';
  });
  svg.innerHTML = out;
}

         + '<text class="sidx" x="' + (x + cw/2 - 1) + '" y="' + (yNxt + hh + 13) + '" text-anchor="middle">' + i + '</text></g>';

  svg.setAttribute("viewBox", "0 0 " + W + " " + H);

  if(!st.grid){
    svg.innerHTML = '<text class="muted" x="' + (W/2) + '" y="' + (H/2) + '" text-anchor="middle">等待初始化…</text>';
    return;
  }
  var rows = st.dpRows, cols = st.dpCols;
  var left = 46, top = 38, right = 16, bottom = 40;
  var cw = (W - left - right) / cols;
  var ch = Math.min(62, (H - top - bottom) / rows);
  var gw = cw * cols, gh = ch * rows;
  var ox = left + (W - left - right - gw) / 2;
  var oy = top + (H - top - bottom - gh) / 2;

  var out = "";
  for(var c=0;c<cols;c++){
    out += '<text class="dphdr" x="' + (ox + c*cw + cw/2) + '" y="' + (oy - 10) + '" text-anchor="middle">' + c + '</text>';
  }
  for(var r=0;r<rows;r++){
    out += '<text class="dphdr" x="' + (ox - 10) + '" y="' + (oy + r*ch + ch/2 + 4) + '" text-anchor="end">' + r + '</text>';
  }
  for(var r=0;r<rows;r++){
    for(var c=0;c<cols;c++){
      var v = st.grid[r][c];
      var cls = "dpcell" + (v === null ? "" : " filled");
      if(st.deps) for(var q=0;q<st.deps.length;q++){
        if(st.deps[q][0] === r && st.deps[q][1] === c) cls += " dep";
      }
      if(st.focus && st.focus[0] === r && st.focus[1] === c) cls += " focus";
      if(st.cellHit && st.cellHit[0] === r && st.cellHit[1] === c) cls += " hit";
      out += '<rect class="' + cls + '" x="' + (ox + c*cw + 1) + '" y="' + (oy + r*ch + 1) + '" width="' + (cw - 2) + '" height="' + (ch - 2) + '" rx="4"/>';
      if(v !== null){
        out += '<text class="dptext" x="' + (ox + c*cw + cw/2) + '" y="' + (oy + r*ch + ch/2 + 5) + '" text-anchor="middle">'
             + (v === Infinity ? "∞" : v) + '</text>';
      }
    }
  }
  var legend = lesson.kind === "floyd" ? "行 = 起点 i　列 = 终点 j"
             : lesson.kind === "idp" ? "行 = 左端点 l　列 = 右端点 r"
             : lesson.kind === "lcs" ? "行 = a 的前 i 个　列 = b 的前 j 个"
             : lesson.kind === "pascal" ? "行 = i　列 = j"
             : "行 = 前 i 个物品　列 = 背包容量 j";
  out += '<text class="dphdr" x="' + left + '" y="' + (H - 10) + '">' + legend + '</text>';
  svg.innerHTML = out;
}

var NODE_COLORS = ["#55cdf1", "#f4a261", "#3ddc97", "#c792ea", "#ef6b6b", "#f7d154"];

function renderGraph(st, g, fresh, lesson){
  var svg = document.getElementById("graph");
  svg.setAttribute("viewBox", "0 0 620 380");
  var n = st.n || g.n;
  if(!n){
    svg.innerHTML = '<text class="muted" x="310" y="190" text-anchor="middle">等待分配存储空间…</text>';
    return;
  }
  var W = 620, H = 380, P = 44;
  var pos = g.pos || circlePos(n);
  function X(i){ return P + pos[i][0] * (W - 2*P); }
  function Y(i){ return P + pos[i][1] * (H - 2*P); }

  var out = "";

  // 还没存进结构的边：画成虚线，作为“目标图”的提示
  var drawn = {};
  for(var i=0;i<st.edges.length;i++) drawn[edgeKey(st.edges[i].u, st.edges[i].v)] = 1;
  for(var i=0;i<g.edges.length;i++){
    var ge = g.edges[i];
    if(drawn[edgeKey(ge[0], ge[1])]) continue;
    out += '<line class="ghost" x1="' + X(ge[0]) + '" y1="' + Y(ge[0]) + '" x2="' + X(ge[1]) + '" y2="' + Y(ge[1]) + '"/>';
  }

  // 已经存好的边
  for(var i=0;i<st.edges.length;i++){
    var e = st.edges[i];
    var x1 = X(e.u), y1 = Y(e.u), x2 = X(e.v), y2 = Y(e.v);
    var active = st.hi && ((st.hi[0] === e.u && st.hi[1] === e.v) || (st.hi[0] === e.v && st.hi[1] === e.u));
    var isMst = st.mst && st.mst.has(edgeKey(e.u, e.v));
    var cls = "edge" + (isMst ? " mst" : "") + (active ? " active" : "") + (fresh.edge === edgeKey(e.u, e.v) ? " fresh" : "");
    out += '<line class="' + cls + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"/>';
    if(g.dir){
      var dx = x2 - x1, dy = y2 - y1;
      var L = Math.sqrt(dx*dx + dy*dy) || 1;
      var ux = dx / L, uy = dy / L;
      var tx = x2 - ux * 20, ty = y2 - uy * 20;
      var bx = tx - ux * 8, by = ty - uy * 8;
      var px = -uy, py = ux;
      out += '<path class="arrow' + (isMst ? " mst" : "") + (active ? " active" : "") + '" d="M' + tx + ' ' + ty
           + ' L' + (bx + px*4.2) + ' ' + (by + py*4.2)
           + ' L' + (bx - px*4.2) + ' ' + (by - py*4.2) + ' Z"/>';
    }
    var mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    var showW = !(lesson && (lesson.kind === "bip" || lesson.kind === "scc" || lesson.kind === "dsu"));
    var dirW = !g.dir || (lesson && (lesson.kind === "bell" || lesson.kind === "flow"));
    if(showW && dirW){
      var lbl = e.w;
      if(lesson && lesson.kind === "flow"){
        var ff = (st.flow && st.flow.get(edgeKey(e.u, e.v))) || 0;
        lbl = ff + "/" + e.w;
      }
      out += '<text class="wlabel" x="' + mx + '" y="' + (my - 7) + '" text-anchor="middle">' + lbl + '</text>';
    }
  }

  for(var v=1; v<=n; v++){
    var visited = st.visited.has(v);
    var current = st.cur === v;
    var ghost = !st.n;
    var settled = st.settled && st.settled.has(v);
    var cc = st.colors ? st.colors.get(v) : undefined;
    var cstyle = "";
    if(cc !== undefined){
      var col = NODE_COLORS[((cc % NODE_COLORS.length) + NODE_COLORS.length) % NODE_COLORS.length];
      cstyle = ' style="fill:' + col + ';fill-opacity:.22;stroke:' + col + '"';
    }
    out += '<g class="node' + (visited ? " visited" : "") + (settled ? " settled" : "") + (current ? " current" : "") + (ghost ? " ghost" : "") + '">'
        +  '<circle cx="' + X(v) + '" cy="' + Y(v) + '" r="17"' + cstyle + '/>'
        +  (CAT.on ? catEars(X(v), Y(v), 17) : '')
        +  '<text x="' + X(v) + '" y="' + Y(v) + '" dy="0.35em" text-anchor="middle">' + v + '</text>';
    if(lesson && (lesson.kind === "dij" || lesson.kind === "bell" || lesson.kind === "spfa"
        || lesson.kind === "prim" || lesson.kind === "scc")){
      var dv = st.dist.get(v);
      var lbl = (dv === Infinity ? "∞" : String(dv));
      var lw = 10 + lbl.length * 6.6;
      var ly = Y(v) + 19;
      out += '<rect class="dplate" x="' + (X(v) - lw/2) + '" y="' + ly + '" width="' + lw + '" height="15" rx="4"/>';
      out += '<text class="dlab" x="' + X(v) + '" y="' + (ly + 11) + '" text-anchor="middle">' + lbl + '</text>';
    }
    out += '</g>';
  }
  svg.innerHTML = out;
}

function adjHTML(st, fresh){
  if(!st.n) return '<div class="empty">等待初始化…</div>';
  var h = '<div class="sub">vector&lt;vector&lt;pair&lt;int,int&gt;&gt;&gt; g（下标 1..' + st.n + '）</div>';
  var total = 0;
  for(var i=1;i<=st.n;i++){
    var list = st.adj.get(i) || [];
    total += list.length;
    h += '<div class="row"><span class="key">g[' + i + ']</span><span class="val">';
    if(!list.length) h += '<span class="empty">空</span>';
    for(var j=0;j<list.length;j++){
      var it = list[j];
      var isNew = fresh.chip === (i + "-" + it.v);
      h += '<span class="chip' + (isNew ? " fresh" : "") + '">(' + it.v + ', ' + it.w + ')</span>';
    }
    h += '</span></div>';
  }
  h += '<div class="sub">共 ' + total + ' 条有向邻接边</div>';
  return h;
}

function matHTML(st, fresh){
  if(!st.n) return '<div class="empty">等待初始化…</div>';
  var n = st.n;
  var h = '<div class="sub">int a[N][N]（只画 1..' + n + '，0 表示无边）</div>';
  h += '<table class="mat"><thead><tr><th></th>';
  for(var j=1;j<=n;j++) h += '<th>' + j + '</th>';
  h += '</tr></thead><tbody>';
  for(var i=1;i<=n;i++){
    h += '<tr><th>' + i + '</th>';
    for(var j=1;j<=n;j++){
      var val = st.matrix[i][j];
      var hl = fresh.mat === (i + "-" + j);
      h += '<td class="' + (val ? "on" : "") + (hl ? " hl" : "") + '">' + (val ? val : "·") + '</td>';
    }
    h += '</tr>';
  }
  h += '</tbody></table>';
  h += '<div class="sub">查边 O(1)；空间 O(n²)；遍历出边 O(n)</div>';
  return h;
}

function fsHTML(st, fresh){
  if(!st.n) return '<div class="empty">等待初始化…</div>';
  var h = '<div class="sub">head[u]：每个点的出边链表头（-1 表示空）</div><div class="chain-list">';
  for(var u=1; u<=st.n; u++){
    h += '<div class="chain"><span class="k">head[' + u + ']</span><span class="ar">→</span>';
    var cur = st.head[u], guard = 0;
    if(cur === -1) h += '<span class="nil">∅</span>';
    while(cur !== -1 && guard++ < 40){
      h += '<span class="idx">' + cur + '</span><span class="ar">→</span>';
      var nx = st.nxt[cur];
      if(nx === -1) h += '<span class="nil">∅</span>';
      cur = nx;
    }
    h += '</div>';
  }
  h += '</div>';

  h += '<div class="sub">边数组（编号从 1 开始，tot = ' + st.tot + '）</div>';
  h += '<table class="fstab"><thead><tr><th>i</th><th>to[i]</th><th>wt[i]</th><th>nxt[i]</th></tr></thead><tbody>';
  if(!st.tot) h += '<tr><td colspan="4" style="color:#4a5b6d">还没有边</td></tr>';
  for(var i=1;i<=st.tot;i++){
    var hl = fresh.fs && i === st.tot;
    h += '<tr class="' + (hl ? "hl" : "") + '"><td>' + i + '</td><td>' + st.to[i] + '</td><td>' + st.wt[i] + '</td><td>' + st.nxt[i] + '</td></tr>';
  }
  h += '</tbody></table>';
  h += '<div class="sub">新边永远插在链表头部，所以遍历顺序和输入顺序相反</div>';
  return h;
}

function orderHTML(st){
  if(!st.order.length) return '<span class="empty">暂无</span>';
  var h = "";
  for(var i=0;i<st.order.length;i++){
    h += '<span class="chip">' + st.order[i] + '</span>';
    if(i < st.order.length-1) h += '<span class="ar" style="color:#44566a">→</span>';
  }
  return h;
}

function dfsHTML(st){
  var h = '<div class="sub">调用栈（栈顶在上）</div><div class="frames">';
  if(!st.dfs.length) h += '<div class="empty">空</div>';
  for(var i=st.dfs.length-1;i>=0;i--){
    var f = st.dfs[i];
    h += '<div class="frame' + (i === st.dfs.length-1 ? " top" : "") + '">'
       + '<span class="fn">dfs(' + f.u + ')</span>'
       + '<span class="loc">' + (f.i >= 0 ? ("邻边 #" + (f.i+1) + " → " + f.v) : "准备访问") + '</span></div>';
  }
  h += '</div>';
  h += '<div class="sub">访问顺序 order</div><div class="val">' + orderHTML(st) + '</div>';
  return h;
}

function bfsHTML(st){
  var h = '<div class="sub">队列（左端是队首）</div><div class="val">';
  if(!st.queue.length) h += '<span class="empty">空</span>';
  for(var i=0;i<st.queue.length;i++){
    h += '<span class="chip' + (i === 0 ? " head" : "") + '">' + st.queue[i] + '</span>';
  }
  h += '</div>';

  h += '<div class="sub">dist[v]（到 1 号点的最短边数）</div><div class="grid-chips">';
  for(var v=1; v<=st.n; v++){
    h += '<span class="kv">' + v + '<b>' + (st.dist.has(v) ? st.dist.get(v) : "-1") + '</b></span>';
  }
  h += '</div>';

  h += '<div class="sub">访问顺序</div><div class="val">' + orderHTML(st) + '</div>';
  return h;
}

function bipHTML(st){
  var n = st.n || 0;
  var h = '<div class="sub">染色结果</div><div class="grid-chips">';
  for(var v=1; v<=n; v++){
    var c = st.colors.get(v);
    var lab = c === 0 ? "A" : (c === 1 ? "B" : "·");
    h += '<span class="kv">' + v + '<b>' + lab + '</b></span>';
  }
  h += '</div>';
  h += '<div class="sub">队列</div><div class="grid-chips">';
  if(!st.queue.length) h += '<span class="kv">空</span>';
  else for(var i=0;i<st.queue.length;i++) h += '<span class="kv">' + st.queue[i] + '</span>';
  h += '</div>';
  h += '<div class="sub">判定规则</div><div class="formula">'
     + '相邻的两个点必须不同色。<br><br>'
     + 'BFS 逐层染反色；<br>'
     + '一旦遇到一条边两端同色，<br>就说明图里有奇环，不是二分图。</div>';
  return h;
}

function sccHTML(st){
  var n = st.n || 0;
  var h = '<div class="sub">dfn / low</div>';
  h += '<table class="fstab"><thead><tr><th>点</th><th>dfn</th><th>low</th></tr></thead><tbody>';
  for(var v=1; v<=n; v++){
    var d = st.dist.get(v) || 0;
    var l = st.lows.get(v);
    h += '<tr><td>' + v + '</td><td>' + (d || "·") + '</td><td>' + (l === undefined ? "·" : l) + '</td></tr>';
  }
  h += '</tbody></table>';
  h += '<div class="sub">栈</div><div class="grid-chips">';
  if(!st.stack || !st.stack.length) h += '<span class="kv">空</span>';
  else for(var i=0;i<st.stack.length;i++) h += '<span class="kv">' + st.stack[i] + '</span>';
  h += '</div>';
  var comps = {};
  st.colors.forEach(function(c){ comps[c] = true; });
  h += '<div class="sub">强连通分量</div><div class="grid-chips">'
     + '<span class="kv">已找到<b>' + Object.keys(comps).length + '</b></span></div>';
  h += '<div class="sub">思路</div><div class="formula">'
     + 'dfn 是访问时间，low 是能绕回的最早时间。<br><br>'
     + 'low[u] == dfn[u] 时，栈里从 u 往上<br>'
     + '的这些点属于同一个强连通分量。</div>';
  return h;
}

function flowHTML(st){
  var h = '<div class="sub">最大流</div><div class="grid-chips">'
        + '<span class="kv">总量<b>' + st.maxflow + '</b></span></div>';
  h += '<div class="sub">边：流量 / 容量</div><div class="val">';
  for(var i=0;i<st.edges.length;i++){
    var e = st.edges[i];
    var f = st.flow.get(edgeKey(e.u, e.v)) || 0;
    h += '<span class="chip">' + e.u + '→' + e.v + '　' + f + '/' + e.w + '</span>';
  }
  h += '</div>';
  h += '<div class="sub">思路</div><div class="formula">'
     + '每次 BFS 找一条还有剩余容量的路径，<br>'
     + '沿路推「瓶颈」那么多的流，<br>'
     + '直到源点到汇点不再连通。</div>';
  return h;
}

function hashHTML(st){
  var m = (st.buckets || []).length;
  var total = 0;
  var h = '<div class="sub">每个桶的链</div><div class="val">';
  for(var b=0;b<m;b++){
    var arr = st.buckets[b] || [];
    total += arr.length;
    h += '<span class="chip">' + b + ': ' + (arr.length ? arr.join("→") : "空") + '</span>';
  }
  h += '</div>';
  h += '<div class="grid-chips" style="margin-top:8px"><span class="kv">元素<b>' + total + '</b></span>'
     + '<span class="kv">装填因子<b>' + (m ? (total/m).toFixed(2) : 0) + '</b></span></div>';
  h += '<div class="sub">冲突怎么办</div><div class="formula">'
     + '不同的 key 可能落到同一个桶（哈希冲突）。<br>'
     + '这里是链地址法：桶里挂一条链表。</div>';
  return h;
}

function permHTML(st){
  var h = '<div class="sub">已找到的排列</div><div class="val">';
  if(!st.perms || !st.perms.length) h += '<span class="chip">还没有</span>';
  else for(var i=0;i<st.perms.length;i++) h += '<span class="chip">' + st.perms[i].join(" ") + '</span>';
  h += '</div>';
  h += '<div class="sub">回溯在做什么</div><div class="formula">'
     + '选一个数 → 往下递归 → 回来时撤销这个数。<br><br>'
     + '「撤销」这一步就是回溯，<br>让别的分支还能用这个数。</div>';
  return h;
}

function bitsHTML(st){
  var bits = st.bits || [];
  var s = "";
  for(var i=bits.length-1;i>=0;i--) s += bits[i];
  var h = '<div class="sub">二进制</div><div class="val"><span class="chip">' + (s || "·") + '</span></div>';
  if(st.vars.count !== undefined){
    h += '<div class="sub">1 的个数</div><div class="grid-chips"><span class="kv">count<b>' + st.vars.count + '</b></span></div>';
  }
  h += '<div class="sub">x &amp; (x - 1)</div><div class="formula">'
     + '把最低位的 1 变成 0。<br>循环几次，就说明有几个 1。</div>';
  return h;
}

function powHTML(st){
  var h = '<div class="sub">变量</div><div class="val">'
        + '<span class="chip">a = ' + (st.vars.a === undefined ? "-" : st.vars.a) + '</span>'
        + '<span class="chip">b = ' + (st.vars.b === undefined ? "-" : st.vars.b) + '</span>'
        + '<span class="chip">r = ' + (st.vars.r === undefined ? "-" : st.vars.r) + '</span></div>';
  h += '<div class="sub">思路</div><div class="formula">'
     + 'b 的每个二进制位代表一个 2^k：<br>'
     + '这一位是 1，就把 a^(2^k) 乘进答案。<br><br>'
     + 'a 每轮平方，b 每轮右移。</div>';
  return h;
}

function ganttHTML(st){
  var items = st.gitems || [];
  var h = '<div class="sub">已选区间</div><div class="val">';
  if(!st.gpicked.size){
    h += '<span class="chip">还没有</span>';
  }else{
    st.gpicked.forEach(function(i){
      h += '<span class="chip">[' + items[i][0] + ', ' + items[i][1] + ']</span>';
    });
  }
  h += '</div>';
  h += '<div class="grid-chips" style="margin-top:8px"><span class="kv">个数<b>' + st.gpicked.size + '</b></span></div>';
  h += '<div class="sub">为什么按右端点排</div><div class="formula">'
     + '越早结束，给后面的区间留的空间越大。<br><br>'
     + '按左端点排会掉进坑里：<br>一个很长的区间可能占掉好几个短的。</div>';
  return h;
}

function dsuHTML(st){
  var n = st.n || 0;
  var h = '<div class="sub">fa 数组（父亲）</div><div class="grid-chips">';
  for(var v=1; v<=n; v++){
    h += '<span class="kv">' + v + '<b>' + (st.dsuParent.get(v) === undefined ? "?" : st.dsuParent.get(v)) + '</b></span>';
  }
  h += '</div>';
  var roots = {};
  for(var v=1; v<=n; v++){
    var x = v, guard = 0;
    while(st.dsuParent.get(x) !== x && guard++ < 20) x = st.dsuParent.get(x);
    roots[x] = true;
  }
  h += '<div class="sub">分成几伙</div><div class="grid-chips">'
     + '<span class="kv">组数<b>' + Object.keys(roots).length + '</b></span></div>';
  h += '<div class="sub">两个优化</div><div class="formula">'
     + '路径压缩：find 时把沿途点直接挂到根上<br>'
     + '按大小合并：小的挂到大的下面<br><br>'
     + '两个一起用，find 接近 O(1)。</div>';
  return h;
}

function primHTML(st){
  var n = st.n || 0;
  var h = '<div class="sub">key（连到树里的最短边）</div><div class="grid-chips">';
  for(var v=1; v<=n; v++){
    var d = st.dist.get(v);
    h += '<span class="kv">' + v + '<b>' + (d === Infinity ? "∞" : d) + '</b></span>';
  }
  h += '</div>';
  h += '<div class="sub">生成树</div><div class="grid-chips">'
     + '<span class="kv">边数<b>' + st.mst.size + '</b></span>'
     + '<span class="kv">总权重<b>' + st.mstWeight + '</b></span></div>';
  h += '<div class="sub">思路</div><div class="formula">'
     + '每次从树外挑 key 最小的点，<br>'
     + '用它的边去更新邻居的 key。<br><br>'
     + '和 Dijkstra 很像，<br>但 key 是「到树的距离」，<br>不是「到起点的距离」。</div>';
  return h;
}

function spfaHTML(st){
  var n = st.n || 0;
  var h = '<div class="sub">dist 数组</div><div class="grid-chips">';
  for(var v=1; v<=n; v++){
    var d = st.dist.get(v);
    h += '<span class="kv">' + v + '<b>' + (d === Infinity ? "∞" : d) + '</b></span>';
  }
  h += '</div>';
  h += '<div class="sub">队列</div><div class="grid-chips">';
  if(!st.queue.length){
    h += '<span class="kv">空</span>';
  }else{
    for(var i=0;i<st.queue.length;i++) h += '<span class="kv">' + st.queue[i] + '</span>';
  }
  h += '</div>';
  h += '<div class="sub">和 Bellman-Ford 的区别</div><div class="formula">'
     + '只把「刚刚被松弛成功」的点放进队列，<br>'
     + '不用每轮把所有边都扫一遍。<br><br>'
     + '队列空了就收敛。<br>平均更快，最坏仍可能退化。</div>';
  return h;
}

function bellHTML(st){
  var n = st.n || 0;
  var h = '<div class="sub">dist 数组</div><div class="grid-chips">';
  for(var v=1; v<=n; v++){
    var d = st.dist.get(v);
    h += '<span class="kv">' + v + '<b>' + (d === Infinity ? "∞" : d) + '</b></span>';
  }
  h += '</div>';
  h += '<div class="sub">当前轮次</div><div class="grid-chips">'
     + '<span class="kv">第<b>' + (st.round || 0) + '</b>轮</span></div>';
  h += '<div class="sub">核心</div><div class="formula">'
     + 'dist[v] = min(dist[v], dist[u] + w)<br><br>'
     + '每轮把所有边扫一遍，<br>最多 n-1 轮一定收敛。<br><br>'
     + '负权边它不怕；<br>再扫一轮还能更新 → 有负环。</div>';
  return h;
}

function dijHTML(st, fresh){
  var h = '<div class="sub">dist[v]（∞ = 还没发现）</div><div class="grid-chips">';
  for(var v=1; v<=st.n; v++){
    var d = st.dist.get(v);
    h += '<span class="kv' + (fresh.dist === v ? " hit" : "") + '">' + v
       + '<b>' + (d === Infinity ? "∞" : d) + '</b></span>';
  }
  h += '</div>';

  h += '<div class="sub">小根堆 pq（按 d 从小到大，堆顶在最左）</div><div class="val">';
  if(!st.heap.length) h += '<span class="empty">空</span>';
  for(var i=0;i<st.heap.length;i++){
    h += '<span class="chip' + (i === 0 ? " head" : "") + '">(' + st.heap[i].d + ',' + st.heap[i].u + ')</span>';
  }
  h += '</div>';

  h += '<div class="sub">已确定最短路（vis = 1）</div><div class="val">';
  if(!st.settled.size) h += '<span class="empty">暂无</span>';
  st.settled.forEach(function(u){ h += '<span class="chip">' + u + '</span>'; });
  h += '</div>';

  var s = st.stats || {};
  h += '<div class="sub">操作计数</div><div class="grid-chips">'
     + '<span class="kv">扫描边<b>' + (s.scan || 0) + '</b></span>'
     + '<span class="kv">松弛成功<b>' + (s.relax || 0) + '</b></span>'
     + '<span class="kv">入堆<b>' + (s.push || 0) + '</b></span>'
     + '<span class="kv">出堆<b>' + (s.pop || 0) + '</b></span>'
     + '</div>';
  return h;
}

function kruHTML(st, fresh){
  var h = '<div class="sub">按权值排序后的边（依次尝试）</div>';
  h += '<table class="fstab"><thead><tr><th>#</th><th>边</th><th>w</th><th>结果</th></tr></thead><tbody>';
  for(var i=0;i<st.sortedList.length;i++){
    var e = st.sortedList[i];
    var status = st.kruStatus[e.idx];
    var cls = status === "mst" ? "ok" : (status === "skip" ? "no" : "");
    if(st.curEdge && st.curEdge.i === e.idx) cls += " cur";
    h += '<tr class="' + cls + '"><td>' + (i+1) + '</td><td>' + e.u + ' – ' + e.v + '</td><td>' + e.w + '</td><td>'
       + (status === "mst" ? "选中" : status === "skip" ? "跳过" : "—") + '</td></tr>';
  }
  h += '</tbody></table>';

  h += '<div class="sub">并查集：从每个点一路往上找根</div>';
  if(!st.dsuParent.size){
    h += '<div class="empty">还没初始化…</div>';
  }else{
    for(var x=1; x<=st.n; x++){
      h += '<div class="chain"><span class="k">点 ' + x + '</span><span class="ar">→</span>';
      var cur = x, parts = [], guard = 0;
      while(guard++ < 60){
        parts.push(cur);
        var par = st.dsuParent.get(cur);
        if(par === undefined || par === cur) break;
        cur = par;
      }
      if(parts.length === 1){
        h += '<span class="idx root">' + parts[0] + '</span><span class="nil">（根）</span>';
      }else{
        for(var j=0;j<parts.length;j++){
          h += '<span class="idx' + (j === parts.length-1 ? " root" : "") + '">' + parts[j] + '</span>';
          if(j < parts.length-1) h += '<span class="ar">→</span>';
        }
      }
      h += '</div>';
    }
  }

  h += '<div class="sub">已选边</div><div class="grid-chips">'
     + '<span class="kv">条数<b>' + st.mst.size + '</b></span>'
     + '<span class="kv">总权值<b>' + st.mstWeight + '</b></span>'
     + '</div>';
  return h;
}

function kvOf(label, val){
  return '<span class="kv">' + label + '<b>' + (val === undefined || val === null || val < 0 ? "—" : val) + '</b></span>';
}

function heapHTML(st){
  var h = '<div class="sub">当前状态</div><div class="grid-chips">'
     + '<span class="kv">元素个数<b>' + Math.max(0, st.harr.length - 1) + '</b></span>'
     + '<span class="kv">当前下标 i<b>' + (st.hcur || "—") + '</b></span>'
     + '</div>';
  h += '<div class="sub">大根堆的性质</div><div class="formula">'
     + 'h[i] ≤ h[i/2]：每个节点都不大于父节点<br>'
     + '所以 h[1] 是整个堆的最大值<br><br>'
     + '插入：放到末尾，然后一路和父节点比较、交换</div>';
  return h;
}

function memoHTML(st){
  var h = '<div class="sub">调用栈（栈顶在上）</div>';
  if(!st.calls.length) h += '<div class="empty">空</div>';
  else{
    h += '<div class="frames">';
    for(var i=st.calls.length-1;i>=0;i--){
      var n = st.calls[i];
      h += '<div class="frame' + (i === st.calls.length-1 ? " top" : "") + '">'
         + '<span class="fn">f(' + n + ')</span>'
         + '<span class="loc">' + (n > 2 ? ("查 memo[" + n + "]") : "边界") + '</span></div>';
    }
    h += '</div>';
  }
  h += '<div class="sub">memo 表</div><div class="grid-chips">';
  for(var v=1; v<=st.n; v++){
    h += '<span class="kv">' + v + '<b>' + (st.arr[v] ? st.arr[v] : "·") + '</b></span>';
  }
  h += '</div>';
  h += '<div class="sub">为什么快</div><div class="formula">'
     + '不加记忆化，f(8) 会把同一批子问题重复算上百次；<br>'
     + '加了以后每个值只算一次，再遇到就直接返回。</div>';
  return h;
}

function monoHTML(st){
  var h = '<div class="sub">单调栈（栈底 → 栈顶）</div><div class="val">';
  if(!st.mstack.length) h += '<span class="empty">空</span>';
  for(var i=0;i<st.mstack.length;i++){
    var idx = st.mstack[i];
    h += '<span class="chip' + (i === st.mstack.length-1 ? " head" : "") + '">' + idx + '</span>';
    if(i < st.mstack.length-1) h += '<span class="ar" style="color:#44566a">→</span>';
  }
  h += '</div>';

  h += '<div class="sub">ans[i]：左边第一个更大元素的下标</div><div class="grid-chips">';
  for(var v=0; v<st.n; v++){
    h += '<span class="kv">' + v + '<b>' + (st.ans.has(v) ? st.ans.get(v) : "·") + '</b></span>';
  }
  h += '</div>';
  h += '<div class="sub">为什么能直接弹掉？</div><div class="formula">'
     + '栈里每个元素右边都还没出现比它大的数；<br>一旦 a[i] 比它大，它就不再是任何位置的答案。</div>';
  return h;
}

function bitHTML(st){
  var h = '<div class="sub">树状数组的核心</div><div class="formula">'
    + 't[i] 存 a[i-lowbit(i) .. i-1] 的和<br><br>'
    + 'lowbit(i) = i &amp; -i<br>'
    + '父节点 = i + lowbit(i)<br>'
    + '查询时 = i - lowbit(i)</div>';
  var cur = st.ptrs && st.ptrs.i;
  if(cur !== undefined && cur >= 0){
    h += '<div class="sub">当前下标</div><div class="grid-chips">'
       + '<span class="kv">i<b>' + (cur + 1) + '</b></span></div>';
  }
  return h;
}

var SIMPLE_KINDS = {
  recur:  { t:"递推",     f:"f[i] = f[i-1] + f[i-2]" },
  rob:    { t:"打家劫舍", f:"dp[i] = max(dp[i-1], dp[i-2] + a[i])" },
  twoptr: { t:"双指针",   f:"和太小 → 左指针右移；和太大 → 右指针左移" },
  slide:  { t:"滑动窗口", f:"右指针扩张；sum ≥ S 时左指针收缩" },
  sieve:  { t:"质数筛",   f:"i 是质数，就划掉 i²、i²+i、i²+2i …" },
  lis:    { t:"LIS",      f:"dp[i] = 1 + max(dp[j])，要求 a[j] < a[i]" },
  binans: { t:"二分答案", f:"在 [1,10] 里找最小的 x，使 x² ≥ 30" },
  fact:   { t:"递归",     f:"fact(n) = n × fact(n-1)，到 1 停" },
  arrange:{ t:"排列数",   f:"A(n,k) = n × (n-1) × … × (n-k+1)" }
};

function simpleHTML(st, lesson){
  var k = SIMPLE_KINDS[lesson.kind];
  var h = '<div class="sub">' + k.t + '</div><div class="formula">' + k.f + '</div>';
  if(lesson.kind === "rob" || lesson.kind === "lis"){
    h += '<div class="sub">dp 表</div><div class="grid-chips">';
    var aux = st.aux || [];
    for(var i=0;i<aux.length;i++) h += '<span class="kv">' + i + '<b>' + (aux[i] === null ? "·" : aux[i]) + '</b></span>';
    h += '</div>';
  }
  if(lesson.kind === "sieve"){
    h += '<div class="sub">已划掉</div><div class="grid-chips">'
       + '<span class="kv">个数<b>' + (st.dimSet ? st.dimSet.size : 0) + '</b></span></div>';
  }
  if(lesson.kind === "binans"){
    h += '<div class="sub">当前区间</div><div class="grid-chips">'
       + '<span class="kv">lo<b>' + (st.ptrs.lo === undefined ? "-" : st.ptrs.lo + 1) + '</b></span>'
       + '<span class="kv">hi<b>' + (st.ptrs.hi === undefined ? "-" : st.ptrs.hi + 1) + '</b></span></div>';
  }
  if(lesson.kind === "slide"){
    h += '<div class="sub">窗口</div><div class="grid-chips">'
       + '<span class="kv">l<b>' + (st.ptrs.lo === undefined ? "-" : st.ptrs.lo) + '</b></span>'
       + '<span class="kv">r<b>' + (st.ptrs.hi === undefined ? "-" : st.ptrs.hi) + '</b></span></div>';
  }
  return h;
}

function arrHTML(st, lesson){
  if(lesson.kind === "mono") return monoHTML(st);
  if(lesson.kind === "memo") return memoHTML(st);
  if(lesson.kind === "bit") return bitHTML(st);
  if(lesson.kind === "perm") return permHTML(st);
  if(SIMPLE_KINDS[lesson.kind]) return simpleHTML(st, lesson);
  var s = st.stats || {};
  var h = "";

  if(lesson.kind === "prefix" || lesson.kind === "diff"){
    h += '<div class="sub">' + (lesson.kind === "prefix" ? "前缀和" : "差分") + '的核心</div><div class="formula">'
       + (lesson.kind === "prefix"
          ? 'pre[i] = pre[i-1] + a[i]<br><br>查询 a[l..r]：<br>pre[r] - pre[l-1]<br><br>预处理 O(n)，每次查询 O(1)'
          : 'd[l] += v;  d[r+1] -= v;<br><br>再对 d 求前缀和，<br>就得到每个位置的变化量<br><br>一次修改 O(1)')
       + '</div>';
  }else{
    h += '<div class="sub">操作计数</div><div class="grid-chips">'
      + '<span class="kv">比较<b>' + (s.cmp || 0) + '</b></span>'
      + (lesson.kind === "merge"
          ? '<span class="kv">移动<b>' + (s.move || 0) + '</b></span>'
          : '<span class="kv">交换<b>' + (s.swap || 0) + '</b></span>')
      + (lesson.kind === "merge"
          ? '<span class="kv">当前区间<b>' + (st.window ? (st.window[1] - st.window[0] + 1) : 0) + '</b></span>'
          : '<span class="kv">已就位<b>' + st.sortedIdx.size + '</b></span>')
      + '</div>';
  }

  if(lesson.kind === "binary"){
    h += '<div class="sub">查找目标</div><div class="grid-chips"><span class="kv">target<b>' + st.target + '</b></span></div>';
    h += '<div class="sub">指针位置</div><div class="grid-chips">'
       + kvOf("lo", st.ptrs.lo) + kvOf("mid", st.ptrs.mid) + kvOf("hi", st.ptrs.hi) + '</div>';
  }

  if(lesson.kind === "bubble"){
    h += '<div class="sub">当前指针</div><div class="grid-chips">'
       + kvOf("j", st.ptrs.j) + '</div>';
  }

  if(lesson.kind === "prefix" && st.query){
    h += '<div class="sub">区间查询</div><div class="grid-chips">'
       + '<span class="kv">a[' + st.query.l + '..' + st.query.r + '] 的和<b>' + st.query.v + '</b></span>'
       + '</div>';
  }

  if(lesson.kind === "diff"){
    h += '<div class="sub">正在修改的区间</div><div class="grid-chips">'
       + '<span class="kv">区间<b>' + (st.window ? (st.window[0] + '..' + st.window[1]) : "—") + '</b></span>'
       + '</div>';
  }

  if(lesson.kind === "quick" || lesson.kind === "merge"){
    h += '<div class="sub">递归栈（栈顶在上）</div>';
    if(!st.ranges.length) h += '<div class="empty">空</div>';
    else{
      h += '<div class="frames">';
      var fname = lesson.kind === "merge" ? "merge_sort" : "quick_sort";
      for(var i=st.ranges.length-1;i>=0;i--){
        var fr = st.ranges[i];
        h += '<div class="frame' + (i === st.ranges.length-1 ? " top" : "") + '">'
           + '<span class="fn">' + fname + '(' + fr.l + ', ' + fr.r + ')</span>'
           + '<span class="loc">长度 ' + (fr.r - fr.l + 1) + '</span></div>';
      }
      h += '</div>';
    }
  }

  if(st.sortedIdx.size){
    h += '<div class="sub">已经确定最终位置的元素</div><div class="val">';
    st.sortedIdx.forEach(function(i){ h += '<span class="chip">a[' + i + ']</span>'; });
    h += '</div>';
  }
  return h;
}

      var ans = st.grid[0][st.dpCols - 1];
      ih += '<div class="grid-chips" style="margin-top:8px"><span class="kv">答案 dp[0][' + (st.dpCols - 1) + ']<b>'
          + (ans === null ? "—" : ans) + '</b></span></div>';
    }
    return ih;
  }
  if(lesson.kind === "floyd"){
    var edges = (data && data.edges) || [];
    var fh = '<div class="sub">边（无向图，权值）</div>';
    fh += '<table class="fstab"><thead><tr><th>u</th><th>v</th><th>w</th></tr></thead><tbody>';
    for(var i=0;i<edges.length;i++){
      fh += '<tr><td>' + edges[i][0] + '</td><td>' + edges[i][1] + '</td><td>' + edges[i][2] + '</td></tr>';
    }
    fh += '</tbody></table>';
    fh += '<div class="sub">状态转移</div><div class="formula">d[i][j] = min(<br>'
        + '&nbsp;&nbsp;d[i][j],<br>&nbsp;&nbsp;d[i][k] + d[k][j]<br>)</div>';
    fh += '<div class="sub">最外层是 k：依次允许经过 0、1、2… 号点中转</div>';
    return fh;
  }
  var items = (data && data.items) || [];
  var h = '<div class="sub">物品</div>';
  h += '<table class="fstab"><thead><tr><th>i</th><th>重量 w</th><th>价值 v</th></tr></thead><tbody>';
  for(var i=0;i<items.length;i++){
    h += '<tr><td>' + (i+1) + '</td><td>' + items[i][0] + '</td><td>' + items[i][1] + '</td></tr>';
  }
  h += '</tbody></table>';
  h += '<div class="sub">状态转移</div><div class="formula">'
     + 'dp[i][j] = max(<br>'
     + '&nbsp;&nbsp;dp[i-1][j],<br>'
     + '&nbsp;&nbsp;dp[' + (lesson.kind === "knap01" ? "i-1" : "i") + '][j-w[i]] + v[i]<br>)'
     + '</div>';
  h += '<div class="sub">' + (lesson.kind === "knap01" ? '每个物品最多选一次：只看上一行 i-1' : '每个物品可以选无限次：可以看本行 i') + '</div>';
  if(st.grid && (lesson.kind === "knap01" || lesson.kind === "knapfull")){
    var last = st.grid[st.dpRows-1][st.dpCols-1];
    h += '<div class="grid-chips"><span class="kv">答案 dp[' + (st.dpRows-1) + '][' + (st.dpCols-1) + ']<b>'
       + (last === null ? "—" : last) + '</b></span></div>';
  }
  return h;
}

function topoHTML(st){
  var h = '<div class="sub">入度 indeg[u]（0 = 可以入队）</div><div class="grid-chips">';
  for(var v=1; v<=st.n; v++){
    var d = st.indeg.has(v) ? st.indeg.get(v) : 0;
    h += '<span class="kv' + (d === 0 ? " zero" : "") + '">' + v + '<b>' + d + '</b></span>';
  }
  h += '</div>';

  h += '<div class="sub">队列（队首在左）</div><div class="val">';
  if(!st.queue.length) h += '<span class="empty">空</span>';
  for(var i=0;i<st.queue.length;i++){
    h += '<span class="chip' + (i === 0 ? " head" : "") + '">' + st.queue[i] + '</span>';
  }
  h += '</div>';

  h += '<div class="sub">拓扑序</div><div class="val">' + orderHTML(st) + '</div>';
  h += '<div class="sub">进度</div><div class="grid-chips">'
     + '<span class="kv">已输出<b>' + st.order.length + ' / ' + st.n + '</b></span></div>';
  return h;
}

   5.5 代码诊所（纯逻辑，可单测）
   ========================================================= */

function parseProblem(text){
  var r = { maxPow:0, maxN:0, size:0, timeLimit:"", hasProblem:false };
  if(!text || !text.trim()) return r;
  r.hasProblem = true;
  var m;
  var re1 = /10\s*\^\s*\{?\s*(\d+)\s*\}?/g;
  while((m = re1.exec(text))) r.maxPow = Math.max(r.maxPow, parseInt(m[1], 10));
  var re2 = /\b1e(\d+)\b/gi;
  while((m = re2.exec(text))) r.maxPow = Math.max(r.maxPow, parseInt(m[1], 10));
  if(r.maxPow > 0) r.maxN = Math.pow(10, r.maxPow);

  // 规模只看 n / m 这类计数变量的上界，避免把 |a_i| ≤ 1e9 当成数组大小
  var re3 = /\b([nmNM])\s*(?:≤|<=|\\le|\\leq)\s*([^,，。;；\n]+)/g;
  while((m = re3.exec(text))){
    var seg = m[2], v = 0;
    var p = seg.match(/10\s*\^\s*\{?\s*(\d+)\s*\}?/);
    if(p) v = Math.pow(10, parseInt(p[1], 10));
    else {
      var q = seg.match(/^\s*(\d{3,})/);
      if(q) v = parseInt(q[1], 10);
    }
    if(v && v < 1e12) r.size = Math.max(r.size, v);
  }
  if(!r.size) r.size = r.maxN;

  var t = text.match(/(\d+(?:\.\d+)?)\s*(?:ms|毫秒)/);
  if(t) r.timeLimit = t[0];
  else { t = text.match(/(\d+(?:\.\d+)?)\s*(?:s|秒)/); if(t) r.timeLimit = t[0]; }
  return r;
}

function fmtBig(v){
  if(v >= 1e8) return (v / 1e8).toFixed(1) + " 亿";
  if(v >= 1e4) return Math.round(v / 1e4) + " 万";
  return String(v);
}

function diagnoseClinic(problem, code){
  var out = [];
  var info = parseProblem(problem);
  var ls = (code || "").split("\n");

  function add(level, line, title, detail, fix){
    out.push({ level:level, line:line || 0, title:title, detail:detail, fix:fix || "" });
  }
  function firstLine(re){
    for(var i=0;i<ls.length;i++) if(re.test(ls[i])) return i + 1;
    return 0;
  }
  if(!code || !code.trim()) return { findings:[], info:info };

  var open = (code.match(/\{/g) || []).length;
  var close = (code.match(/\}/g) || []).length;
  if(open !== close){
    add("error", 0, "花括号不配对",
        "代码里有 " + open + " 个 `{`，却有 " + close + " 个 `}`。",
        "先检查是不是漏了右括号。");
  }

  if(info.maxPow >= 18){
    add("warn", firstLine(/\bint\b/), "数据到 1e18，int 装不下",
        "题目上界超过 `2^31-1`（约 2.1e9），`int` 会溢出。",
        "把参与运算和累加的变量改成 `long long`。");
  }else if(info.maxPow >= 9 && /\bint\s+(sum|ans|res|tot|total)\b/.test(code)){
    add("warn", firstLine(/\bint\s+(sum|ans|res|tot|total)\b/), "答案可能超过 int",
        "数据到 1e" + info.maxPow + "，累加结果很容易超过 `2.1e9`。",
        "把 `sum` / `ans` 改成 `long long`。");
  }

  var arrRe = /\b(?:int|long long|char|double)\s+[a-zA-Z_]\w*\s*\[\s*(\d+)\s*\]/g, mm;
  while((mm = arrRe.exec(code))){
    var cap = parseInt(mm[1], 10);
    if(info.size && cap >= 100 && cap < info.size && cap < 1e8){
      var ln = code.slice(0, mm.index).split("\n").length;
      add("error", ln, "数组开小了",
          "数组容量是 " + cap + "，但题目规模到 " + info.size + "。",
          "把常量改成 `" + (info.size + 5) + "` 以上。");
    }
  }

  var vla = /\b(?:int|long long|double)\s+[a-zA-Z_]\w*\s*\[\s*[a-zA-Z_]\w*\s*\]/;
  if(vla.test(code)){
    add("warn", firstLine(vla), "变长数组不是标准 C++",
        "`int a[n]` 是 GCC 扩展，n 很大时容易爆栈。",
        "改成全局数组或 `vector<int> a(n)`。");
  }

  if(info.size >= 1e4){
    var nested = 0;
    for(var i=0;i<ls.length-1;i++){
      if(/\bfor\s*\(/.test(ls[i])){
        var ind = ls[i].search(/\S/);
        for(var j=i+1;j<Math.min(i+4, ls.length);j++){
          if(/\bfor\s*\(/.test(ls[j]) && ls[j].search(/\S/) > ind){ nested = i + 1; break; }
        }
        if(nested) break;
      }
    }
    if(nested){
      add("warn", nested, "可能是 O(n²)",
          "题目规模到 " + info.size + "，两层循环大约 " + fmtBig(info.size * info.size) + " 次操作。",
          "看能不能换成排序 / 前缀和 / 双指针 / 哈希，把内层降下来。");
    }
  }

  if(/cin|cout/.test(code) && !/sync_with_stdio/.test(code) && info.size >= 1e5){
    add("info", firstLine(/\bcin\b|\bcout\b/), "大数据下 cin/cout 可能偏慢",
        "默认情况下 `cin` 和 `printf` 同步，输入 1e5 以上可能超时。",
        "在 `main` 开头加 `ios::sync_with_stdio(false); cin.tie(0);`");
  }

  var endlLine = 0;
  for(var i=0;i<ls.length;i++) if(/\bendl\b/.test(ls[i])){ endlLine = i + 1; break; }
  if(endlLine){
    add("info", endlLine, "`endl` 会强制刷新缓冲",
        "每次 `endl` 都 flush，放在循环里会明显变慢。",
        "换成 `'\\n'`。");
  }

  if(/scanf/.test(code) && /%d/.test(code) && /long long/.test(code)){
    add("warn", firstLine(/scanf/), "`%d` 配 `long long` 是未定义行为",
        "`scanf(\"%d\", &x)` 读 `long long` 只会写低 32 位。",
        "改成 `%lld`，或者直接用 `cin`。");
  }

  var midRe = /\(\s*[a-zA-Z_]\w*\s*\+\s*[a-zA-Z_]\w*\s*\)\s*\/\s*2/;
  if(info.maxN >= 1e9 && midRe.test(code)){
    add("warn", firstLine(midRe), "`(l + r) / 2` 可能溢出",
        "当 l、r 都接近 2e9 时，`l + r` 会超过 int 上限。",
        "写成 `l + (r - l) / 2`。");
  }

  if(/memset\s*\(\s*[a-zA-Z_]/.test(code) && /vector\s*</.test(code)){
    add("error", firstLine(/memset\s*\(/), "`memset` 不能用在 vector 上",
        "`vector` 对象内部是指针，`memset` 会把内部字段一起清掉。",
        "用 `fill(v.begin(), v.end(), 0)` 或 `vector<int> v(n, 0)`。");
  }

  var fnRe = /(?:void|int|long long|bool|double)\s+([a-zA-Z_]\w*)\s*\([^)]*\)\s*\{/g;
  var fnm, recFound = false;
  while((fnm = fnRe.exec(code))){
    var name = fnm[1];
    if(name === "main") continue;
    var body = code.slice(fnm.index);
    var cnt = (body.match(new RegExp("\\b" + name + "\\s*\\(", "g")) || []).length;
    if(cnt > 1){ recFound = true; break; }
  }
  if(recFound && info.size >= 1e5){
    add("info", 0, "递归可能爆栈",
        "题目规模到 " + info.size + "，递归深度可能超过默认栈空间（约 8MB）。",
        "考虑改成显式栈，或者确认深度不会太大。");
  }

  if(/while\s*\(\s*[a-zA-Z_]\w*\s*--\s*\)/.test(code) && !/memset|fill\s*\(/.test(code)){
    add("info", firstLine(/while\s*\(\s*[a-zA-Z_]\w*\s*--\s*\)/), "多组数据：全局数组要清空",
        "上一组数据的残留会影响下一组。",
        "每组开始前 `memset` 或重新赋值。");
  }

  var loop1 = /for\s*\(\s*int\s+[a-zA-Z_]\w*\s*=\s*1\s*;[^;]*<=\s*\w+/;
  if(info.size && loop1.test(code)){
    add("info", firstLine(loop1), "下标从 1 开始时，数组要开 n + 1",
        "循环会走到 `i == n`，如果数组只开了 `n` 个，`a[n]` 就越界了。",
        "把数组开成 `n + 1` 或 `n + 5`。");
  }

  var rank = { error:0, warn:1, info:2 };
  out.sort(function(a, b){
    if(rank[a.level] !== rank[b.level]) return rank[a.level] - rank[b.level];
    return (a.line || 1e9) - (b.line || 1e9);
  });
  return { findings: out, info: info };
}

var app = {
  lessonIndex: 0,
  graph: JSON.parse(JSON.stringify(PRESET)),
  dag: JSON.parse(JSON.stringify(DAG_PRESET)),
  neg: JSON.parse(JSON.stringify(NEG_PRESET)),
  bip: JSON.parse(JSON.stringify(BIP_PRESET)),
  scc: JSON.parse(JSON.stringify(SCC_PRESET)),
  flow: JSON.parse(JSON.stringify(FLOW_PRESET)),
  dsu: JSON.parse(JSON.stringify(DSU_PRESET)),
  array: null,
  lesson: null,
  steps: [],
  cursor: 0,
  timer: null,
  playing: false
};

function curGraph(){
  if(!app.lesson) return app.graph;
  if(app.lesson.data === "dag") return app.dag;
  if(app.lesson.data === "neg") return app.neg;
  if(app.lesson.data === "bip") return app.bip;
  if(app.lesson.data === "scc") return app.scc;
  if(app.lesson.data === "flow") return app.flow;
  if(app.lesson.data === "dsu") return app.dsu;
  return app.graph;
}

function rebuild(keepCursor){
  app.lesson = LESSONS[app.lessonIndex];
  if(app.lesson.view !== "graph" && !app.array) app.array = defaultData(app.lesson);
  app.steps = buildSteps(app.lesson, curGraph(), app.array);
  if(!keepCursor) app.cursor = 0;
  app.cursor = clamp(app.cursor, 0, app.steps.length - 1);
  render();
  updateJumpKinds();
}

function render(){
  var step = app.steps[app.cursor] || null;
  var st = stateAt(app.lesson, curGraph(), app.array, app.steps, app.cursor);
  var fresh = freshFromStep(step);
  var isArr = app.lesson.view === "array";
  var isDp = app.lesson.view === "dp";
  var isHeap = app.lesson.view === "heap";
  var isStr = app.lesson.view === "string";
  var isSeg = app.lesson.view === "segtree";
  var isTrie = app.lesson.view === "trie";
  var isGantt = app.lesson.view === "gantt";
  var isBits = app.lesson.view === "bits";
  var isHash = app.lesson.view === "hash";
  var isGraph = app.lesson.view === "graph";

  renderCode(app.lesson, step ? step.line : -1);
  if(isArr) renderArray(st, app.lesson);
  else if(isDp) renderDP(st, app.lesson);
  else if(isHeap) renderHeap(st, app.lesson);
  else if(isStr) renderString(st, app.lesson);
  else if(isSeg) renderSeg(st, app.lesson);
  else if(isTrie) renderTrie(st, app.lesson);
  else if(isGantt) renderGantt(st, app.lesson);
  else if(isBits) renderBits(st, app.lesson);
  else if(isHash) renderHash(st, app.lesson);
  else renderGraph(st, curGraph(), fresh, app.lesson);
  renderStruct(st, app.lesson, fresh, app.array);

  document.getElementById("vizTitle").textContent = isDp
    ? (app.lesson.kind === "floyd" ? "距离表" : "DP 表")
    : (isArr ? "数组" : (isHeap ? "堆" : (isStr ? "字符串" : (isSeg ? "线段树"
    : (isTrie ? "字典树" : (isGantt ? "区间" : (isBits ? "二进制" : (isHash ? "哈希桶" : "图"))))))));
  document.getElementById("btnRandom").textContent = isGraph ? "随机图" : "换一组数据";
  document.getElementById("btnPreset").textContent = isGraph ? "示例图" : "还原示例";
  document.getElementById("crumb").innerHTML =
    app.lesson.sec + ' <span style="color:#3d4e60">/</span> <b>' + app.lesson.nav + '</b>';

  var ntxt = step ? step.note : "";
  if(CAT.on && ntxt && app.cursor % 9 === 4) ntxt += "　喵~";
  document.getElementById("narration").textContent = ntxt;
  updatePaws(app.cursor >= app.steps.length - 1);
  document.getElementById("counter").textContent = (app.cursor + 1) + " / " + app.steps.length;

  var scrub = document.getElementById("scrub");
  scrub.max = Math.max(0, app.steps.length - 1);
  scrub.value = app.cursor;

  document.getElementById("prev").disabled = app.cursor <= 0;
  document.getElementById("next").disabled = app.cursor >= app.steps.length - 1;
  touchProgress();
}

function go(k){
  app.cursor = clamp(k, 0, app.steps.length - 1);
  render();
}

function togglePlay(){
  if(app.playing) stopPlay();
  else startPlay();
}

function startPlay(){
  if(app.cursor >= app.steps.length - 1) app.cursor = 0;
  app.playing = true;
  document.getElementById("play").textContent = "⏸";
  var speed = parseFloat(document.getElementById("speed").value);
  var delay = Math.round(1000 / speed);
  app.timer = setInterval(function(){
    if(app.cursor >= app.steps.length - 1){ stopPlay(); return; }
    go(app.cursor + 1);
  }, delay);
  render();
}

function stopPlay(){
  app.playing = false;
  if(app.timer) clearInterval(app.timer);
  app.timer = null;
  document.getElementById("play").textContent = "▶";
}

function selectLesson(idx){
  stopPlay();
  app.lessonIndex = idx;
  var btns = document.querySelectorAll(".side .it");
  for(var i=0;i<btns.length;i++) btns[i].classList.toggle("on", i === idx);
  app.array = defaultData(LESSONS[idx]);
  rebuild(false);
  var saved = progress[LESSONS[idx].id];
  if(saved && saved.c > 0){
    app.cursor = clamp(saved.c, 0, app.steps.length - 1);
    render();
  }
  updateProgressUI();
  applyCollapse();
}

var uiState = { collapsed:{} };
function loadUI(){
  try{ uiState = JSON.parse(localStorage.getItem("algoviz.ui.v1")) || { collapsed:{} }; }
  catch(e){ uiState = { collapsed:{} }; }
  if(!uiState.collapsed) uiState.collapsed = {};
}
function saveUI(){

}

function updateThemeUI(){
  var t = uiState.theme || "cyan";
  document.body.setAttribute("data-theme", t);
  var items = document.querySelectorAll(".titem");
  for(var i=0;i<items.length;i++){
    items[i].classList.toggle("on", items[i].getAttribute("data-t") === t);
  }
  var sw = document.querySelector("#themeBtn .tsw");

function buildSide(){
  var side = document.getElementById("side");
  var h = "", lastSec = null, open = false;
  for(var i=0;i<LESSONS.length;i++){
    var L = LESSONS[i];
    if(L.sec !== lastSec){
      if(open) h += '</div>';
      var cnt = 0;
      for(var q=0;q<LESSONS.length;q++) if(LESSONS[q].sec === L.sec) cnt++;
      h += '<button class="grp" data-sec="' + L.sec + '"><span class="caret">▸</span>' + L.sec
         + '<span class="cnt">' + cnt + '</span></button>';
      h += '<div class="grp-body" data-sec="' + L.sec + '">';
      lastSec = L.sec; open = true;
    }
    h += '<button class="it" data-i="' + i + '">' + L.nav + '</button>';
  }
  if(open) h += '</div>';
  side.innerHTML = h;
  side.addEventListener("click", function(ev){
    var t = ev.target, grp = null;
    while(t && t !== side){ if(t.classList && t.classList.contains("grp")){ grp = t; break; } t = t.parentNode; }
    if(grp){ toggleSection(grp.getAttribute("data-sec")); return; }
    t = ev.target;
    while(t && t !== side && !(t.classList && t.classList.contains("it"))) t = t.parentNode;
    if(t && t !== side) selectLesson(parseInt(t.getAttribute("data-i"), 10));
  });
  applyCollapse();
}

function mdInline(s){
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
}

function renderClinic(res){
  var el = document.getElementById("clinicResult");
  var stat = document.getElementById("clinicStat");
  var fs = res.findings;
  if(!fs.length){
    el.innerHTML = '<div class="clinic-empty">没扫出常见的坑。但这不代表代码是对的——逻辑错误请点「复制给 AI」。</div>';
    stat.textContent = "0 个问题";
    return;
  }
  var err = 0, warn = 0, info = 0, h = "";
  for(var i=0;i<fs.length;i++){
    var f = fs[i];
    if(f.level === "error") err++;
    else if(f.level === "warn") warn++;
    else info++;
    h += '<div class="finding ' + f.level + '">'
       + '<div class="ft">' + mdInline(f.title)
       + (f.line ? '<span class="fl">第 ' + f.line + ' 行</span>' : '')
       + '</div>'
       + '<div class="fd">' + mdInline(f.detail) + '</div>'
       + (f.fix ? '<div class="fx">→ ' + mdInline(f.fix) + '</div>' : '')
       + '</div>';
  }
  el.innerHTML = h;
  stat.textContent = [
    err ? err + " 个错误" : "",
    warn ? warn + " 个警告" : "",
    info ? info + " 个提示" : ""
  ].filter(Boolean).join(" · ");
}

/* ---------- 练习模式 ---------- */

function otherNodes(exclude, n, count){
  var pool = [];
  for(var i=1;i<=n;i++) if(i !== exclude) pool.push(i);
  var out = [];
  while(out.length < count && pool.length){
    out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  }
  return out;
}

function nextEventFrom(k, type, gap){
  for(var j=k;j<Math.min(app.steps.length, k + gap);j++){
    var evs = app.steps[j].events || [];
    for(var i=0;i<evs.length;i++) if(evs[i].t === type) return { j:j, ev:evs[i] };
  }
  return null;
}

function makeQuizAt(k){
  var kind = app.lesson.kind;
  var steps = app.steps;
  if(k >= steps.length - 1) return null;

  if(kind === "dfs" || kind === "bfs" || kind === "topo"){
    var nv = nextEventFrom(k + 1, "visit", 8);
    if(!nv) return null;
    var ans = nv.ev.u;
    return {
      q: "在现在这一步之后，下一个被访问 / 输出的点是？",
      opts: [ans].concat(otherNodes(ans, curGraph().n, 2)),
      ans: ans,
      why: "下一步：" + steps[nv.j].note
    };
  }
  if(kind === "dij"){
    var np = nextEventFrom(k + 1, "hpPop", 8);
    if(!np || np.ev.u === undefined) return null;
    var a2 = np.ev.u;
    return {
      q: "下一个从小根堆里弹出的点是？",
      opts: [a2].concat(otherNodes(a2, curGraph().n, 2)),
      ans: a2,
      why: steps[np.j].note
    };
  }
  if(kind === "binary"){
    if(steps[k].line !== 2) return null;
    var nf = nextEventFrom(k + 1, "found", 3);
    var np2 = nextEventFrom(k + 1, "ptr", 3);
    var ansB, whyB;
    if(nf){ ansB = "找到了"; whyB = "a[mid] 正好等于目标，直接返回"; }
    else if(np2 && np2.ev.name === "lo"){ ansB = "右半边"; whyB = "a[mid] < target，左边界右移"; }
    else if(np2 && np2.ev.name === "hi"){ ansB = "左半边"; whyB = "a[mid] > target，右边界左移"; }
    else return null;
    return { q: "a[mid] 和 target 比完，接下来去搜哪边？", opts:["左半边", "右半边", "找到了"], ans:ansB, why:whyB };
  }
  if(kind === "bubble"){
    var ce = null;
    var evs = steps[k].events || [];
    for(var i=0;i<evs.length;i++) if(evs[i].t === "cmp") ce = evs[i];
    if(!ce) return null;
    var sw = nextEventFrom(k + 1, "swap", 2);
    var willSwap = !!(sw && sw.ev.i === ce.i && sw.ev.j === ce.j);
    return {
      q: "比较 a[" + ce.i + "] 和 a[" + (ce.j) + "]，这两个数会交换吗？",
      opts: ["会交换", "不会交换"],
      ans: willSwap ? "会交换" : "不会交换",
      why: willSwap ? "左边比右边大，是逆序" : "顺序已经正确"
    };
  }
  if(kind === "quick"){
    var qe = null;
    var qevs = steps[k].events || [];
    for(var q1=0;q1<qevs.length;q1++) if(qevs[q1].t === "cmp") qe = qevs[q1];
    if(!qe) return null;
    var qn = steps[k + 1];
    var qswap = !!(qn && (qn.events || []).some(function(e){ return e.t === "swap"; }));
    return {
      q: "a[" + qe.i + "] 和基准比较后，会换到左边吗？",
      opts: ["会", "不会"],
      ans: qswap ? "会" : "不会",
      why: qn ? qn.note : ""
    };
  }
  if(kind === "merge"){
    if(steps[k].line !== 7) return null;
    var mc = false;
    var mevs = steps[k].events || [];
    for(var m1=0;m1<mevs.length;m1++) if(mevs[m1].t === "cmp") mc = true;
    if(!mc) return null;
    var mn = steps[k + 1];
    if(!mn) return null;
    var left = mn.line === 7;
    return {
      q: "左右两段各出一个数比较，哪个更小、会被写进 tmp？",
      opts: ["左边那段", "右边那段"],
      ans: left ? "左边那段" : "右边那段",
      why: mn.note
    };
  }
  if(kind === "heap"){
    if(steps[k].line !== 4) return null;
    var hn = steps[k + 1];
    var hsw = !!(hn && (hn.events || []).some(function(e){ return e.t === "hswap"; }));
    return {
      q: "当前元素会和父节点交换吗？",
      opts: ["会交换", "不会交换"],
      ans: hsw ? "会交换" : "不会交换",
      why: hn ? hn.note : ""
    };
  }
  if(kind === "mono"){
    var moc = false;
    var mevs2 = steps[k].events || [];
    for(var o1=0;o1<mevs2.length;o1++) if(mevs2[o1].t === "cmp") moc = true;
    if(!moc) return null;
    var mon = steps[k + 1];
    var mop = !!(mon && (mon.events || []).some(function(e){ return e.t === "spop"; }));
    return {
      q: "栈顶这个元素会被弹掉吗？",
      opts: ["会被弹掉", "不会被弹掉"],
      ans: mop ? "会被弹掉" : "不会被弹掉",
      why: mon ? mon.note : ""
    };
  }
  return null;
}
