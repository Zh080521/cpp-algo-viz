<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>C++ 算法可视化 · 图论</title>
<style>
  :root{
    --bg:#080d13;
    --panel:#0f1721;
    --panel2:#0c141d;
    --line:#1b2836;
    --line2:#25384a;
    --text:#c9d6e4;
    --dim:#7d90a5;
    --cyan:#55cdf1;
    --cyan-rgb:85 205 241;
    --amber:#f4a261;
    --green:#3ddc97;
    --red:#ef6b6b;
    --mono:"JetBrains Mono","Cascadia Code","Fira Code",Consolas,"Courier New",monospace;
  }
  body[data-theme="violet"]{--cyan:#a78bfa;--cyan-rgb:167 139 250;--amber:#f4a261;--green:#34d399;--red:#fb7185}
  body[data-theme="blue"]{--cyan:#60a5fa;--cyan-rgb:96 165 250;--amber:#fbbf24;--green:#34d399;--red:#f87171}
  body[data-theme="pink"]{--cyan:#f472b6;--cyan-rgb:244 114 182;--amber:#fbbf24;--green:#34d399;--red:#ef4444}
  body[data-theme="lime"]{--cyan:#a3e635;--cyan-rgb:163 230 53;--amber:#fbbf24;--green:#2dd4bf;--red:#fb7185}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;color:var(--text);
    font-family:"Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:
      radial-gradient(900px 480px at 12% -12%, #13212f 0%, transparent 62%),
      radial-gradient(1100px 560px at 88% -6%, #101a28 0%, transparent 58%),
      var(--bg);
    display:flex;flex-direction:column;overflow:hidden;
  }
  ::selection{background:rgb(var(--cyan-rgb) / 28%)}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#22303f;border-radius:6px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:#2e4257;background-clip:padding-box}
  :focus-visible{outline:2px solid rgb(var(--cyan-rgb) / 55%);outline-offset:2px}
  button,select,input{font-family:inherit;color:inherit}
  button{cursor:pointer}

  /* ---------- 顶栏 ---------- */
  .top{display:flex;align-items:center;gap:20px;padding:0 20px;height:56px;
    border-bottom:1px solid var(--line);background:rgba(9,14,20,.86);backdrop-filter:blur(14px);
    box-shadow:0 10px 30px rgba(0,0,0,.28);flex:none;position:relative;z-index:5}
  .top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg,transparent,rgb(var(--cyan-rgb) / 25%),transparent)}
  .brand{display:flex;align-items:center;gap:9px;font-size:15px;letter-spacing:.2px;white-space:nowrap}
  .brand b{font-weight:600;letter-spacing:.3px;
    background:linear-gradient(92deg,#effaff,#9fe4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand .sub{color:#65798d;font-size:11.5px;border-left:1px solid var(--line2);padding-left:11px;letter-spacing:.2px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--cyan);
    box-shadow:0 0 10px var(--cyan),0 0 26px rgb(var(--cyan-rgb) / 45%)}
  .crumb{color:var(--dim);font-size:12px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
  .crumb b{color:#e6f1fb;font-weight:500;background:rgb(var(--cyan-rgb) / 8%);
    border:1px solid rgb(var(--cyan-rgb) / 18%);padding:3px 9px;border-radius:7px}
  .clinic-btn{margin-left:0;border:1px solid rgb(var(--cyan-rgb) / 22%);background:rgb(var(--cyan-rgb) / 7%);
    color:var(--cyan);padding:7px 14px;border-radius:9px;font-size:12.5px;transition:.16s}
  .clinic-btn:hover{background:rgb(var(--cyan-rgb) / 14%);border-color:rgb(var(--cyan-rgb) / 38%);
    box-shadow:0 0 18px rgb(var(--cyan-rgb) / 18%)}

  .theme-wrap{margin-left:auto;position:relative}
  .theme-btn{display:flex;align-items:center;gap:7px;border:1px solid var(--line2);
    background:#131f2b;color:#9fb2c6;padding:7px 12px;border-radius:9px;font-size:12.5px;transition:.16s}
  .theme-btn:hover{color:var(--text);background:#182736}
  .theme-btn .tsw{width:10px;height:10px;border-radius:50%;background:var(--cyan);
    box-shadow:0 0 8px rgb(var(--cyan-rgb) / 70%);transition:.2s}
  .theme-menu{position:absolute;right:0;top:42px;width:152px;z-index:30;
    background:#0e1721;border:1px solid var(--line2);border-radius:11px;padding:6px;
    box-shadow:0 16px 40px rgba(0,0,0,.5)}
  .theme-menu[hidden]{display:none}
  .titem{display:flex;align-items:center;gap:9px;width:100%;background:transparent;border:0;
    color:#a9bccf;padding:7px 9px;border-radius:7px;font-size:12.5px;text-align:left;transition:.14s}
  .titem:hover{background:#16222e;color:#dceaf7}
  .titem i{width:10px;height:10px;border-radius:50%;background:var(--c);
    box-shadow:0 0 8px var(--c);flex:none}
  .titem.on{background:#17252f;color:#e6f2ff}
  .titem.on::after{content:"✓";margin-left:auto;color:var(--cyan);font-size:11px}
  .tsep{height:1px;background:var(--line);margin:5px 4px}

  /* ---------- 猫猫模式 ---------- */
  body.cat{
    --bg:#140a11;
    --panel:#1e1019;
    --panel2:#180c14;
    --line:#3a1f2e;
    --line2:#4d2a3d;
    --text:#f2dbe7;
    --dim:#ab8b9c;
    --cyan:#ff8fc7;
    --cyan-rgb:255 143 199;
    --amber:#ffc48c;
    --green:#8fe3b0;
    --red:#ff6b8a;
    background:
      radial-gradient(900px 480px at 12% -12%, #3a1a2b 0%, transparent 62%),
      radial-gradient(1100px 560px at 88% -6%, #2a1220 0%, transparent 58%),
      var(--bg);
  }
  body.cat .pane{background:linear-gradient(180deg,#241320,#1a0d17);border-color:var(--line)}
  body.cat .pane-h{background:linear-gradient(180deg,rgba(46,24,36,.9),rgba(26,13,23,.5))}
  body.cat .pane-h > span:first-child::before{content:"🐾";width:auto;height:auto;background:none;
    box-shadow:none;font-size:11px;vertical-align:-1px;opacity:1}
  body.cat .code{background:#160b12}
  body.cat .side{background:linear-gradient(180deg,rgba(26,14,21,.92),rgba(18,9,15,.72))}
  body.cat .narration{background:linear-gradient(90deg,rgb(var(--cyan-rgb) / 12%),rgba(30,16,25,.92) 58%)}
  body.cat .ctrl-row button{background:#241322;border-color:#3a1f2e}
  body.cat .ctrl-row button:hover{background:#2e1a2a}
  body.cat .theme-menu{background:#1e1019;border-color:var(--line2)}
  body.cat .graph-wrap{background-image:radial-gradient(rgb(var(--cyan-rgb) / 13%) 1.4px, transparent 1.4px);
    background-size:26px 26px}
  body.cat #graph .node circle{fill:#2c1521;stroke:#5a2f45}
  body.cat #graph .bar{fill:#3a1c2b;stroke:#5a2f45}
  body.cat #graph .acell{fill:#241120;stroke:#4a2438}
  body.cat .tnode circle,body.cat .snode circle{fill:#2c1521;stroke:#5a2f45}
  body.cat .schar rect{fill:#2c1521;stroke:#5a2f45}
  body.cat .cedge{stroke:#4a2438}
  body.cat .dot{position:relative;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
  body.cat .dot::before,body.cat .dot::after{content:"";position:absolute;top:-4px;width:0;height:0;
    border-left:3px solid transparent;border-right:3px solid transparent;border-bottom:5px solid var(--cyan)}
  body.cat .dot::before{left:-2px;transform:rotate(-20deg)}
  body.cat .dot::after{right:-2px;transform:rotate(20deg)}
  body.cat .ndot{position:relative;border-radius:50%}
  body.cat .ndot::before,body.cat .ndot::after{content:"";position:absolute;top:-3px;width:0;height:0;
    border-left:2px solid transparent;border-right:2px solid transparent;border-bottom:3.5px solid var(--amber)}
  body.cat .ndot::before{left:-1px;transform:rotate(-22deg)}
  body.cat .ndot::after{right:-1px;transform:rotate(22deg)}
  .ear{fill:var(--cyan);opacity:.9}
  .ear.wig{animation:earWig .45s ease-in-out;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes earWig{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}
    55%{transform:rotate(7deg)}80%{transform:rotate(-3deg)}}
  #paws{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s}
  #paws.on{opacity:1}
  #paws span{position:absolute;opacity:0;
    animation:pawIn .45s ease-out forwards}
  #paws svg{width:24px;height:24px;fill:var(--cyan);opacity:.55}
  @keyframes pawIn{from{opacity:0;transform:scale(.5) rotate(var(--r))}
    to{opacity:1;transform:scale(1) rotate(var(--r))}}

  /* ---------- 代码诊所 ---------- */
  .clinic{position:fixed;inset:0;z-index:60;background:rgba(6,10,15,.985);
    display:flex;flex-direction:column;gap:12px;padding:16px 22px 18px;overflow:hidden}
  .clinic[hidden]{display:none}
  .clinic-head{display:flex;align-items:baseline;gap:12px;flex:none}
  .clinic-head b{font-size:16px;color:#e8f2ff}
  .clinic-sub{color:var(--dim);font-size:12px}
  .clinic-x{margin-left:auto;width:32px;height:28px;border-radius:7px;border:1px solid var(--line);
    background:#16212d;color:#9fb2c6}
  .clinic-x:hover{color:var(--cyan)}
  .clinic-body{flex:1 1 0;min-height:180px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .clinic-col{display:flex;flex-direction:column;min-height:0}
  .clinic-col label{font-size:12px;color:var(--dim);margin-bottom:6px}
  .clinic-col textarea{flex:1;min-height:0;resize:none;background:#0c141c;border:1px solid var(--line);
    border-radius:10px;color:#c8d5e3;font-family:var(--mono);font-size:12.5px;line-height:1.6;
    padding:12px;outline:none}
  .clinic-col textarea:focus{border-color:#2c4b60}
  .clinic-actions{flex:none;display:flex;align-items:center;gap:9px}
  .clinic-actions button{border:1px solid var(--line);background:#16212d;color:#9fb2c6;
    padding:7px 14px;border-radius:8px;font-size:12.5px;transition:.15s}
  .clinic-actions button:hover{color:var(--cyan);border-color:#2c4b60}
  .clinic-actions .clinic-primary{background:var(--cyan);color:#07141c;border-color:var(--cyan);font-weight:600}
  .clinic-stat{color:var(--dim);font-size:12px;margin-left:4px}
  .clinic-result{flex:none;max-height:30vh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:2px}
  .clinic-result:empty{display:none}
  .finding{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#111a24;font-size:13px}
  .finding.error{border-color:#5a2b2b;background:#1a1113}
  .finding.warn{border-color:#5a4626;background:#1b1710}
  .finding.info{border-color:#24475a;background:#0f1b24}
  .finding .ft{font-weight:600;margin-bottom:4px;display:flex;align-items:baseline;gap:8px}
  .finding.error .ft{color:#ef8080}
  .finding.warn .ft{color:var(--amber)}
  .finding.info .ft{color:var(--cyan)}
  .finding .fl{font-family:var(--mono);font-size:11px;color:#5f7488;font-weight:400}
  .finding .fd{color:#9fb2c6;line-height:1.65}
  .finding .fd code{font-family:var(--mono);background:#0a1219;padding:1px 5px;border-radius:4px;color:#ffd9b3}
  .finding .fx{color:#7fd6a8;margin-top:5px}
  .clinic-empty{color:var(--dim);font-size:13px;padding:16px;border:1px dashed var(--line);border-radius:10px;text-align:center}

  /* ---------- 练习 / 复杂度 / 值历史 ---------- */
  .quiz{position:fixed;inset:0;z-index:70;background:rgba(4,8,12,.86);
    display:flex;align-items:center;justify-content:center;padding:24px}
  .quiz[hidden]{display:none}
  .quiz-card{width:min(560px,92vw);background:#121b25;border:1px solid #26394b;border-radius:14px;
    padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .quiz-tag{color:var(--cyan);font-size:11px;letter-spacing:1.2px;margin-bottom:8px}
  .quiz-q{font-size:16px;color:#e8f2ff;line-height:1.6;margin-bottom:16px}
  .quiz-opts{display:flex;flex-direction:column;gap:8px}
  .quiz-opts button{text-align:left;padding:11px 14px;border-radius:9px;border:1px solid #26394b;
    background:#16212d;color:#c8d5e3;font-size:14px;transition:.15s}
  .quiz-opts button:hover{border-color:#2c4b60}
  .quiz-opts button.ok{border-color:var(--green);background:#12352a;color:#b9ffe3}
  .quiz-opts button.no{border-color:#7a3a3a;background:#2a1416;color:#ffb9b9}
  .quiz-fb{margin-top:12px;font-size:13px;color:#9fb2c6;line-height:1.6;min-height:20px}
  .quiz-next{margin-top:10px;padding:8px 16px;border-radius:8px;border:1px solid var(--cyan);
    background:var(--cyan);color:#07141c;font-weight:600}

  .cplx{position:fixed;inset:0;z-index:70;background:rgba(4,8,12,.88);
    display:flex;align-items:center;justify-content:center;padding:24px}
  .cplx[hidden]{display:none}
  .cplx-card{width:min(760px,94vw);background:#121b25;border:1px solid #26394b;border-radius:14px;
    padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .cplx-head{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
  .cplx-head b{color:#e8f2ff;font-size:15px}
  .cplx-sub{color:var(--dim);font-size:12px}
  .cplx-head .clinic-x{margin-left:auto}
  .cplx svg{width:100%;height:auto;display:block}

  .popover{position:fixed;z-index:80;background:#111a24;border:1px solid #2c4b60;border-radius:10px;
    padding:10px 12px;box-shadow:0 12px 36px rgba(0,0,0,.6);max-width:300px;max-height:320px;overflow:auto;font-size:12.5px}
  .popover[hidden]{display:none}
  .popover .ph{color:var(--cyan);font-size:11.5px;margin-bottom:8px;letter-spacing:.5px}
  .popover .pi{display:flex;gap:8px;padding:4px 6px;border-radius:6px;cursor:pointer;align-items:baseline}
  .popover .pi:hover{background:#18242f}
  .popover .pn{font-family:var(--mono);font-size:11px;color:#5f7488;flex:none;width:52px}
  .popover .pv{font-family:var(--mono);color:#ffd9b3;flex:none;width:34px;text-align:right}
  .popover .pt{color:#8fa3b8;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .toast{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);z-index:90;
    background:#16212d;border:1px solid #2c4b60;color:#c8d5e3;padding:8px 16px;border-radius:20px;
    font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .toast[hidden]{display:none}
  .side .it.done{color:#8fd6b4}
  .side .it.done::after{content:"✓";float:right;color:var(--green);font-size:11px}

  /* ---------- 并排对比 ---------- */
  .cmp{position:fixed;inset:0;z-index:65;background:rgba(5,9,14,.985);
    display:flex;flex-direction:column;gap:10px;padding:16px 22px 18px}
  .cmp[hidden]{display:none}
  .cmp-head{display:flex;align-items:baseline;gap:12px}
  .cmp-head b{font-size:16px;color:#e8f2ff}
  .cmp-sub{color:var(--dim);font-size:12px}
  .cmp-head .clinic-x{margin-left:auto}
  .cmp-pick{display:flex;align-items:center;gap:10px}
  .cmp-pick select{background:#16212d;border:1px solid var(--line);border-radius:8px;
    padding:6px 10px;font-size:13px;color:#c8d5e3}
  .cmp-vs{color:#5f7488;font-size:12px}
  .cmp-pick .tool{height:30px;padding:0 12px;font-size:12.5px;border-radius:8px;
    border:1px solid var(--line);background:#16212d;color:#9fb2c6}
  .cmp-info{margin-left:auto;color:#5f7488;font-size:11.5px}
  .cmp-grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .cmp-card{background:#101922;border:1px solid #22313f;border-radius:12px;
    display:flex;flex-direction:column;min-height:0;padding:10px 12px}
  .cmp-title{display:flex;justify-content:space-between;align-items:baseline;
    font-size:13px;color:#dceaf7;margin-bottom:4px}
  .cmp-count{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
  .cmp-viz{flex:1;min-height:0}
  .cmp-viz svg{width:100%;height:100%;display:block}
  .cmp-note{font-size:12px;color:#8fa3b8;height:34px;overflow:hidden;line-height:1.4;margin-top:4px}
  .cmp-ctrl{display:flex;align-items:center;gap:10px}
  .cmp-ctrl button{width:44px;height:32px;border-radius:8px;border:1px solid var(--cyan);
    background:var(--cyan);color:#07141c;font-weight:700}
  #cmpScrub{flex:1;accent-color:var(--cyan)}
  .cmp .counter{font-family:var(--mono);font-size:12px;color:var(--dim);min-width:90px;text-align:center}
  .cbar{fill:#1d2b3a;stroke:#2f4257;stroke-width:1}
  .cbar.sorted{fill:#12352a;stroke:#3ddc97}
  .cbar.cmp{fill:#4a3418;stroke:#f4a261}
  .cbar.swap{fill:#4a2020;stroke:#ef6b6b}
  .cbar.pivot{fill:#12303d;stroke:#4cc9f0}
  .clab{fill:#c8d5e3;font-family:var(--mono);font-size:10px}
  .cidx{fill:#4d6072;font-family:var(--mono);font-size:9px}
  .cdone{fill:#3ddc97;font-size:11px;font-family:var(--mono)}
  .cnode circle{fill:#1a2532;stroke:#3a4b5e;stroke-width:1.4}
  .cnode.visited circle{fill:#12352a;stroke:#3ddc97;stroke-width:1.8}
  .cnode.cur circle{stroke:#4cc9f0;stroke-width:2.6}
  .ctext{fill:#c8d5e3;font-family:var(--mono);font-size:11px}
  .cedge{stroke:#2b3949;stroke-width:1.5}

  /* ---------- 侧栏目录 ---------- */
  .shell{flex:1;min-height:0;display:flex}
  .side{width:184px;flex:none;border-right:1px solid var(--line);
    background:linear-gradient(180deg,rgba(11,18,26,.92),rgba(8,13,19,.72));
    overflow-y:auto;padding:10px 10px 18px}
  .side .grp{display:flex;align-items:center;gap:6px;width:100%;background:transparent;border:0;
    color:#5b6f84;font-size:10px;letter-spacing:1.5px;margin-top:10px;padding:6px 9px;
    border-radius:7px;text-align:left;cursor:pointer;transition:.15s}
  .side .grp:first-child{margin-top:2px}
  .side .grp:hover{color:#a5c9df;background:rgb(var(--cyan-rgb) / 5%)}
  .side .grp .caret{font-size:10px;color:#6b8aa3;transition:transform .18s;width:10px}
  .side .grp.open .caret{transform:rotate(90deg)}
  .side .grp .cnt{margin-left:auto;font-size:9.5px;color:#41566a;letter-spacing:0}
  .grp-body.collapsed{display:none}
  .side .it{display:block;width:100%;text-align:left;background:transparent;border:0;
    color:#8ba0b5;padding:6px 11px;border-radius:8px;font-size:12.5px;margin-bottom:1px;
    transition:.15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
  .side .it:hover{background:#131f2b;color:#d7e8f7}
  .side .it.on{background:linear-gradient(90deg,rgb(var(--cyan-rgb) / 16%),rgb(var(--cyan-rgb) / 3%));
    color:var(--cyan);font-weight:500;box-shadow:inset 0 0 0 1px rgb(var(--cyan-rgb) / 12%)}
  .side .it.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;
    border-radius:2px;background:var(--cyan);box-shadow:0 0 9px rgb(var(--cyan-rgb) / 65%)}

  /* ---------- 主区域 ---------- */
  .main{flex:1;min-width:0;min-height:0;display:grid;gap:12px;padding:12px;
    grid-template-columns:minmax(340px,420px) minmax(340px,1fr) minmax(270px,350px)}
  .pane{background:linear-gradient(180deg,#0f1822,#0c141c);border:1px solid var(--line);border-radius:14px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 10px 28px rgba(0,0,0,.25);
    min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .pane-h{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 14px;border-bottom:1px solid var(--line);font-size:11.5px;color:#8397ac;
    letter-spacing:.6px;background:linear-gradient(180deg,rgba(18,28,39,.9),rgba(12,20,29,.5))}
  .pane-h > span:first-child::before{content:"";display:inline-block;width:6px;height:6px;
    border-radius:50%;background:var(--cyan);opacity:.65;margin-right:8px;vertical-align:1px;
    box-shadow:0 0 8px rgb(var(--cyan-rgb) / 55%)}
  .pane-h .hint{font-size:10.5px;opacity:.7}
  .btns{display:flex;gap:6px}
  .mini{border:1px solid var(--line);background:#18222e;color:var(--dim);
    font-size:11px;padding:3px 9px;border-radius:6px;transition:.15s}
  .mini:hover{color:var(--cyan);border-color:#2c4b60}

  /* ---------- 代码 ---------- */
  .code{flex:1;overflow:auto;padding:12px 0;font-family:var(--mono);font-size:12px;line-height:1.85;background:#0a1218}
  .ln{display:flex;padding:0 16px 0 0;border-left:2px solid transparent;white-space:pre}
  .ln .no{flex:none;width:36px;text-align:right;padding-right:12px;color:#33465a;
    user-select:none;font-size:11.5px}
  .ln .src{color:#b9c8d8}
  .ln.active{background:linear-gradient(90deg,rgb(var(--cyan-rgb) / 15%),rgb(var(--cyan-rgb) / 2%) 82%,transparent);
    border-left-color:var(--cyan)}
  .ln.active .src{color:#eaf6ff}
  .ln.active .no{color:var(--cyan)}

  /* ---------- 图 ---------- */
  .graph-wrap{flex:1;min-height:0;padding:6px;display:flex;align-items:center;justify-content:center;
    position:relative;
    background-image:radial-gradient(rgba(125,165,205,.10) 1px,transparent 1px);
    background-size:24px 24px;background-position:center}
  #graph{width:100%;height:100%;max-width:680px;max-height:540px;display:block}
  #graph .edge{stroke:#2b3949;stroke-width:2;transition:stroke .15s}
  #graph .edge.mst{stroke:var(--green);stroke-width:3}
  #graph .arrow{fill:#2b3949}
  #graph .arrow.mst{fill:var(--green)}
  #graph .arrow.active{fill:var(--amber)}
  #graph .edge.active{stroke:var(--amber);stroke-width:3.4;
    filter:drop-shadow(0 0 5px rgba(244,162,97,.75))}
  #graph .edge.fresh{stroke-dasharray:420;animation:draw .5s ease-out forwards}
  @keyframes draw{from{stroke-dashoffset:420}to{stroke-dashoffset:0}}
  #graph .wlabel{font-family:var(--mono);font-size:11px;fill:#8fa3b8;
    stroke:#0e1620;stroke-width:3.5;paint-order:stroke}
  #graph .node circle{fill:#1a2532;stroke:#3a4b5e;stroke-width:1.6;transition:.18s}
  #graph .node text{font-family:var(--mono);font-size:13px;fill:#9fb2c6;user-select:none}
  #graph .node.visited circle{fill:#12352a;stroke:var(--green);stroke-width:2}
  #graph .node.visited text{fill:#b9ffe3}
  #graph .node.settled circle{fill:#3a2a15;stroke:var(--amber);stroke-width:2}
  #graph .node.settled text{fill:#ffe0bd}
  #graph .dlab{font-family:var(--mono);font-size:11px;fill:var(--amber);
    stroke:#0e1620;stroke-width:3;paint-order:stroke}
  #graph .dplate{fill:#0e1620;stroke:#2b3a49;stroke-width:1}
  #graph .node.current circle{stroke:var(--cyan);stroke-width:3;
    filter:drop-shadow(0 0 8px rgb(var(--cyan-rgb) / 80%))}
  #graph .node.current text{fill:#eaf9ff}
  #graph .ghost{stroke:#2e4255;stroke-width:1.7;stroke-dasharray:5 7}
  #graph .node.ghost circle{fill:#101a24;stroke:#344a5e;stroke-dasharray:4 4}
  #graph .node.ghost text{fill:#5d7389}
  #graph .muted{fill:#5b6d80;font-size:13px}

  /* 数组柱状图 */
  #graph .bar{fill:#1d2b3a;stroke:#2f4257;stroke-width:1.2;transition:fill .15s}
  #graph .bar.sorted{fill:#12352a;stroke:var(--green)}
  #graph .bar.pivot{fill:#12303d;stroke:var(--cyan)}
  #graph .bar.cmp{fill:#4a3418;stroke:var(--amber)}
  #graph .bar.swap{fill:#4a2020;stroke:var(--red)}
  #graph .bar.found{fill:#1f5c3f;stroke:var(--green);
    filter:drop-shadow(0 0 8px rgba(61,220,151,.7))}
  #graph .bar.out{opacity:.16}
  #graph .vlab{fill:#c8d5e3;font-family:var(--mono);font-size:13px}
  #graph .ilab{fill:#5f7488;font-family:var(--mono);font-size:11px}
  #graph .plab{font-family:var(--mono);font-size:11px;font-weight:600}
  #graph .acell{fill:#101a24;stroke:#2b3a49;stroke-width:1}
  #graph .acell.empty{stroke-dasharray:3 4}
  #graph .acell.hit{stroke:var(--amber);fill:#2a2318}
  #graph .acell.hit2{stroke:var(--cyan);fill:#0f2a33}
  #graph .alab{fill:#9fb2c6;font-family:var(--mono);font-size:11px}
  #graph .rowlab{fill:#5f7488;font-family:var(--mono);font-size:11px}

  /* DP 表格 */
  #graph .dpcell{fill:#111b26;stroke:#22313f;stroke-width:1}
  #graph .dpcell.filled{fill:#16232f}
  #graph .dpcell.dep{stroke:var(--cyan);stroke-width:2}
  #graph .dpcell.focus{stroke:var(--amber);stroke-width:2.4}
  #graph .dpcell.hit{fill:#2a2318}
  #graph .dptext{fill:#c8d5e3;font-family:var(--mono);font-size:13px}
  #graph .dphdr{fill:#5f7488;font-family:var(--mono);font-size:11px}

  /* 堆 */
  #graph .hnode{fill:#1a2532;stroke:#3a4b5e;stroke-width:1.6}
  #graph .hnode.cur{fill:#2a2318;stroke:var(--amber);stroke-width:2.4}
  #graph .htext{fill:#c8d5e3;font-family:var(--mono);font-size:13px}
  #graph .hidx{fill:#5f7488;font-family:var(--mono);font-size:10px}

  /* 字符串 */
  .schar rect{fill:#141f2b;stroke:#2b3a49;stroke-width:1}
  .schar.hi rect{fill:#2a2318;stroke:var(--amber);stroke-width:2}
  .schar.cy rect{fill:#0f2a33;stroke:var(--cyan);stroke-width:2}
  .schar.ok rect{fill:#12352a;stroke:var(--green);stroke-width:1.6}
  .schar text{fill:#c8d5e3;font-family:var(--mono);font-size:14px}
  .sidx{fill:#5f7488;font-family:var(--mono);font-size:9px}
  .slabel{fill:#5f7488;font-family:var(--mono);font-size:11px}

  /* 线段树 */
  .snode circle{fill:#1a2532;stroke:#3a4b5e;stroke-width:1.4}
  .snode.cur circle{fill:#2a2318;stroke:var(--amber);stroke-width:2.4}
  .snode.full circle{fill:#12352a;stroke:var(--green);stroke-width:2.2}
  .snode.part circle{fill:#0f2a33;stroke:var(--cyan);stroke-width:2}
  .sval{fill:#c8d5e3;font-family:var(--mono);font-size:12px}
  .srange{fill:#5f7488;font-family:var(--mono);font-size:9px}

  /* 区间调度 */
  .gbar{fill:#1d2b3a;stroke:#2f4257;stroke-width:1.2}
  .gbar.picked{fill:#12352a;stroke:var(--green);stroke-width:1.8}
  .gbar.cur{stroke:var(--amber);stroke-width:2.2}
  .glab{fill:#7d90a5;font-family:var(--mono);font-size:10px}
  .gaxis{stroke:#16212b;stroke-width:1}

  /* 二进制位 */
  .bcell rect{fill:#14202c;stroke:#2b3a49;stroke-width:1.2}
  .bcell.hi rect{fill:#2a2318;stroke:var(--amber);stroke-width:2.4}
  .bval{fill:#c8d5e3;font-family:var(--mono);font-size:26px}
  .bidx{fill:#5f7488;font-family:var(--mono);font-size:10px}
  .bignum{fill:#c9d6e4;font-family:var(--mono);font-size:16px}
  .bnote{fill:#5f7488;font-family:var(--mono);font-size:10px}

  /* 哈希桶 */
  .hcol{fill:#101a24;stroke:#2b3a49;stroke-width:1.2}
  .hcol.hi{stroke:var(--amber);stroke-width:2}
  .hkey{fill:#1c2c3c;stroke:#35506a;stroke-width:1}
  .hkey.hi{fill:#2a2318;stroke:var(--amber)}
  .hhead{fill:#5f7488;font-family:var(--mono);font-size:11px}
  .hhead.hi{fill:var(--amber)}
  .hval{fill:#c8d5e3;font-family:var(--mono);font-size:12px}

  /* Trie */
  .tnode circle{fill:#1a2532;stroke:#3a4b5e;stroke-width:1.4}
  .tnode.cur circle{fill:#2a2318;stroke:var(--amber);stroke-width:2.4}
  .tnode.end circle{fill:#12352a;stroke:var(--green);stroke-width:2}
  .tnode text{fill:#c8d5e3;font-family:var(--mono);font-size:12px}
  .tnode .endring{fill:none;stroke:var(--green);stroke-width:1;stroke-dasharray:3 3}

  /* ---------- 结构面板 ---------- */
  .struct{flex:1;overflow:auto;padding:12px 14px;font-size:13px}
  .sub{color:#7d90a5;font-size:10.8px;letter-spacing:.6px;margin:15px 0 8px;
    display:flex;align-items:center;gap:7px}
  .sub::before{content:"";width:3px;height:10px;border-radius:2px;background:#2b4157;flex:none}
  .sub:first-child{margin-top:0}
  .empty{color:#4a5b6d;font-size:12px;font-style:italic}

  .row{display:flex;align-items:flex-start;gap:10px;padding:5px 0;border-bottom:1px dashed #1a2733}
  .row:last-child{border-bottom:0}
  .key{font-family:var(--mono);color:var(--cyan);font-size:12px;width:52px;flex:none;padding-top:2px}
  .val{display:flex;flex-wrap:wrap;gap:5px;min-height:20px}

  .chip{font-family:var(--mono);font-size:12px;background:#14202c;border:1px solid #26394b;
    color:#a9c2d8;padding:1px 7px;border-radius:5px;white-space:nowrap;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}
  .chip.fresh{animation:pop .35s ease-out;border-color:var(--amber);color:var(--amber)}
  .chip.head{border-color:var(--cyan);color:var(--cyan)}
  @keyframes pop{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}

  /* 矩阵 */
  table.mat{border-collapse:collapse;font-family:var(--mono);font-size:12px}
  table.mat th,table.mat td{width:42px;height:34px;text-align:center;
    border:1px solid #1e2c3a;color:#5f7385}
  table.mat th{color:var(--dim);background:#0f1822;font-weight:400}
  table.mat td{color:#7b8fa3}
  table.mat td.on{color:#79b3cf;background:rgb(var(--cyan-rgb) / 7%)}
  table.mat td.hl{background:rgba(244,162,97,.28);color:#ffd9b3;border-color:var(--amber)}
  table.mat th.hl{color:var(--amber)}

  /* 前向星 */
  .chain{display:flex;align-items:center;gap:6px;padding:3px 0;font-family:var(--mono);font-size:12px}
  .chain .k{color:var(--cyan);width:62px;flex:none}
  .chain .ar{color:#44566a}
  .chain .idx{background:#182634;border:1px solid #2b3f53;padding:0 7px;border-radius:5px;color:#ffd9b3}
  .chain .nil{color:#4a5b6d}
  table.fstab{border-collapse:collapse;font-family:var(--mono);font-size:12px;width:100%}
  table.fstab th,table.fstab td{border-bottom:1px solid #1b2836;padding:5px 8px;text-align:center}
  table.fstab th{color:var(--dim);font-weight:400;font-size:11px}
  table.fstab td{color:#9db3c7}
  table.fstab tr.hl td{background:rgba(244,162,97,.16);color:#ffd9b3}
  table.fstab tr.ok td{color:var(--green)}
  table.fstab tr.no td{color:#57687a}
  table.fstab tr.cur td{background:rgba(244,162,97,.14)}
  .chain .idx.root{border-color:var(--green);color:#b9ffe3}

  /* DFS 栈 */
  .frames{display:flex;flex-direction:column;gap:6px}
  .frame{display:flex;align-items:center;justify-content:space-between;gap:8px;
    border:1px solid #26394b;border-radius:8px;padding:6px 10px;background:#141f2b}
  .frame.top{border-color:var(--cyan);box-shadow:0 0 0 1px rgb(var(--cyan-rgb) / 25%) inset}
  .frame .fn{font-family:var(--mono);color:#dceaf7;font-size:12.5px}
  .frame .loc{font-family:var(--mono);color:var(--dim);font-size:11px}
  .frame.top .loc{color:var(--cyan)}

  .grid-chips{display:flex;flex-wrap:wrap;gap:6px}
  .kv{font-family:var(--mono);font-size:12px;background:#141f2b;border:1px solid #223446;
    border-radius:6px;padding:2px 8px;color:#7f95aa}
  .kv b{color:var(--amber);font-weight:500;margin-left:5px}
  .kv.hit{animation:pop .35s ease-out;border-color:var(--amber);background:rgba(244,162,97,.12)}
  .formula{font-family:var(--mono);font-size:12px;color:#a9c2d8;background:#111b26;
    border:1px solid #22313f;border-radius:7px;padding:9px 10px;line-height:1.7;word-break:break-all}

  /* ---------- 解说 ---------- */
  .narration{flex:none;display:flex;align-items:center;gap:10px;height:42px;
    padding:0 16px;margin:0 12px 8px;border:1px solid var(--line);border-radius:11px;
    background:linear-gradient(90deg,rgb(var(--cyan-rgb) / 8%),rgba(15,23,33,.92) 58%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.02);
    font-size:12.8px;color:#a9bfd4;overflow:hidden}
  .ndot{width:6px;height:6px;border-radius:50%;background:var(--amber);flex:none;
    box-shadow:0 0 8px var(--amber)}
  #narration{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---------- 控制条 ---------- */
  .ctrl{flex:none;display:flex;flex-direction:column;gap:2px;padding:0 18px 10px}
  .ctrl-row{display:flex;align-items:center;gap:9px;height:42px}
  .ctrl-row button{width:38px;height:32px;border-radius:9px;border:1px solid var(--line);
    background:#131f2b;color:#9fb2c6;font-size:13px;transition:.15s}
  .ctrl-row button:hover{color:var(--cyan);border-color:var(--line2);background:#182736;transform:translateY(-1px)}
  .ctrl-row button:active{transform:translateY(0)}
  .ctrl-row button.play{width:46px;background:var(--cyan);color:#04121a;
    border-color:rgb(var(--cyan-rgb) / 60%);font-weight:700;box-shadow:0 4px 16px rgb(var(--cyan-rgb) / 28%)}
  .ctrl-row button.play:hover{filter:brightness(1.06)}
  .ctrl-row button:disabled{opacity:.35;cursor:default;transform:none}
  .tools{height:34px;gap:8px;border-top:1px solid #16202b;padding-top:3px}
  .tool-label{color:#5f7488;font-size:11.5px;letter-spacing:.4px}
  .ctrl .tools button{width:auto;height:26px;padding:0 11px;font-size:12px;border-radius:7px}
  #jumpKind{background:#131f2b;border:1px solid var(--line);border-radius:7px;
    padding:4px 7px;font-size:12px;color:#9fb2c6;height:26px}
  .prog{margin-left:auto;color:#5f7488;font-size:11.5px}
  .prog b{color:var(--green);font-weight:500}
  #scrub,#cmpScrub{-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}
  #scrub::-webkit-slider-runnable-track,#cmpScrub::-webkit-slider-runnable-track{
    height:4px;border-radius:2px;background:#1b2a38}
  #scrub::-webkit-slider-thumb,#cmpScrub::-webkit-slider-thumb{-webkit-appearance:none;
    width:13px;height:13px;border-radius:50%;background:var(--cyan);margin-top:-4.5px;
    box-shadow:0 0 0 3px rgb(var(--cyan-rgb) / 16%),0 0 10px rgb(var(--cyan-rgb) / 55%)}
  #scrub::-moz-range-thumb,#cmpScrub::-moz-range-thumb{width:13px;height:13px;border:0;
    border-radius:50%;background:var(--cyan)}
  #scrub{flex:1;accent-color:var(--cyan);height:4px;cursor:pointer}
  .counter{font-family:var(--mono);font-size:12px;color:var(--dim);min-width:78px;text-align:center}
  #speed{background:#16212d;border:1px solid var(--line);border-radius:8px;
    padding:6px 8px;font-size:12px;color:#9fb2c6}

  @media (max-width:1180px){
    .shell{flex-direction:column}
    .side{width:auto;display:flex;align-items:center;gap:3px;overflow-x:auto;
      border-right:0;border-bottom:1px solid var(--line);padding:7px 10px;flex:none}
    .side .grp{display:none}
    .side .grp-body,.side .grp-body.collapsed{display:contents}
    .side .it{width:auto;margin:0;white-space:nowrap;flex:none}
    .crumb{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .main{grid-template-columns:1fr;grid-template-rows:auto auto auto;overflow:auto}
    .pane{min-height:320px}
    body{overflow:auto;height:auto}
  }
  @media (max-width:560px){
    .brand .sub{display:none}
    .crumb{display:none}
    .theme-btn{padding:7px 10px;white-space:nowrap}
    .clinic-btn{padding:7px 10px;white-space:nowrap}
    .main{padding:8px;gap:8px}
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="dot"></span><b>AlgoViz</b><span class="sub">C++ 算法可视化</span></div>
  <div class="crumb" id="crumb"></div>
  <div class="theme-wrap">
    <button id="themeBtn" class="theme-btn" title="切换配色"><span class="tsw"></span>配色</button>
    <div class="theme-menu" id="themeMenu" hidden>
      <button class="titem" data-t="cyan"><i style="--c:#55cdf1"></i>青色</button>
      <button class="titem" data-t="violet"><i style="--c:#a78bfa"></i>紫罗兰</button>
      <button class="titem" data-t="blue"><i style="--c:#60a5fa"></i>天蓝</button>
      <button class="titem" data-t="pink"><i style="--c:#f472b6"></i>品红</button>
      <button class="titem" data-t="lime"><i style="--c:#a3e635"></i>青柠</button>
      <div class="tsep"></div>
      <button class="titem" id="catToggle"><i style="--c:#ff8fc7"></i>猫猫模式</button>
    </div>
  </div>
  <button id="clinicBtn" class="clinic-btn">代码诊所</button>
</header>

<div class="clinic" id="clinic" hidden>
  <div class="clinic-head">
    <b>代码诊所</b>
    <span class="clinic-sub">粘贴题面和你的代码，先做一遍常见坑检查；逻辑错误请点「复制给 AI」</span>
    <button id="clinicClose" class="clinic-x">✕</button>
  </div>

  <div class="clinic-body">
    <div class="clinic-col">
      <label>题目（Markdown，可以不填）</label>
      <textarea id="clinicProblem" spellcheck="false" placeholder="把题面粘进来。会自动识别数据范围和时间限制，例如：
1 ≤ n ≤ 10^5，|a_i| ≤ 10^9，时间限制 1s"></textarea>
    </div>
    <div class="clinic-col">
      <label>你的代码（C++）</label>
      <textarea id="clinicCode" spellcheck="false" placeholder="#include <bits/stdc++.h>
using namespace std;
int a[100005];
int main() {
    int n; cin >> n;
    for (int i = 0; i < n; i++) cin >> a[i];
    int sum = 0;
    for (int i = 0; i < n; i++) sum += a[i];
    cout << sum << endl;
}"></textarea>
    </div>
  </div>

  <div class="clinic-actions">
    <button id="clinicRun" class="clinic-primary">检查</button>
    <button id="clinicCopy">复制给 AI</button>
    <button id="clinicDemo">载入示例</button>
    <button id="clinicClear">清空</button>
    <span class="clinic-stat" id="clinicStat"></span>
  </div>

  <div class="clinic-result" id="clinicResult"></div>
</div>

<div class="shell">
  <aside class="side" id="side"></aside>
  <main class="main">
  <section class="pane">
    <div class="pane-h"><span>参考代码</span><span class="hint">← → 单步 · 空格 播放</span></div>
    <div class="code" id="code"></div>
  </section>

  <section class="pane">
    <div class="pane-h">
      <span id="vizTitle">图</span>
      <span class="btns">
        <button id="btnRandom" class="mini">随机图</button>
        <button id="btnPreset" class="mini">示例图</button>
      </span>
    </div>
    <div class="graph-wrap"><svg id="graph" viewBox="0 0 620 380" preserveAspectRatio="xMidYMid meet"></svg><div id="paws"></div></div>
  </section>

  <section class="pane">
    <div class="pane-h"><span id="structTitle">存储结构</span></div>
    <div class="struct" id="struct"></div>
  </section>
  </main>
</div>

<div class="narration"><span class="ndot"></span><span id="narration"></span></div>

<footer class="ctrl">
  <div class="ctrl-row">
    <button id="reset" title="回到开头">⏮</button>
    <button id="prev" title="上一步">◀</button>
    <button id="play" class="play" title="播放 / 暂停">▶</button>
    <button id="next" title="下一步">▶│</button>
    <input id="scrub" type="range" min="0" max="0" value="0" />
    <span id="counter" class="counter">0 / 0</span>
    <button id="share" title="复制当前这一步的链接">🔗</button>
    <select id="speed" title="播放速度">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
      <option value="4">4×</option>
    </select>
  </div>
  <div class="ctrl-row tools">
    <span class="tool-label">跳到下一次</span>
    <select id="jumpKind"></select>
    <button id="jumpNext" class="tool">执行</button>
    <button id="quizBtn" class="tool">练一练</button>
    <button id="cplxBtn" class="tool">复杂度</button>
    <button id="cmpBtn" class="tool">并排对比</button>
    <button id="doneBtn" class="tool">标记完成</button>
    <span id="progressInfo" class="prog"></span>
  </div>
</footer>

<div class="quiz" id="quiz" hidden>
  <div class="quiz-card">
    <div class="quiz-tag" id="quizTag">预测下一步</div>
    <div class="quiz-q" id="quizQ"></div>
    <div class="quiz-opts" id="quizOpts"></div>
    <div class="quiz-fb" id="quizFb"></div>
    <button class="quiz-next" id="quizNext" hidden>继续 →</button>

      if(v.indexOf(x) < 0) v.push(x);

  return a;
}

function circlePos(n){
  var p = {};
  for(var i=1;i<=n;i++){
    var a = -Math.PI/2 + (i-1)*2*Math.PI/n;
    p[i] = [0.5 + 0.35*Math.cos(a), 0.5 + 0.35*Math.sin(a)];
  }
  return p;
}

function buildAdj(g){
  var adj = new Map();
  for(var i=1;i<=g.n;i++) adj.set(i, []);
  for(var k=0;k<g.edges.length;k++){
    var e = g.edges[k];
    adj.get(e[0]).push([e[1], e[2]]);
    adj.get(e[1]).push([e[0], e[2]]);
  }
  return adj;
}

function randomDAG(){
  var n = 6 + Math.floor(Math.random() * 2);
  var edges = [], has = new Set();
  function add(u, v){
    if(u >= v) return;
    var k = u + "-" + v;
    if(has.has(k)) return;
    has.add(k); edges.push([u, v, 1]);
  }
  for(var i = 1; i < n; i++) add(i, i + 1);
  for(var a = 1; a <= n; a++){
    for(var b = a + 2; b <= n; b++) if(Math.random() < 0.22) add(a, b);
  }
  var pos = {};
  for(var v = 1; v <= n; v++){
    pos[v] = [0.07 + (v - 1) * (0.86 / (n - 1)), 0.5 + ((v % 3) - 1) * 0.28];
  }
  return { n:n, dir:true, edges:edges, pos:pos };
}

function randomNeg(){

    [1, 2, 1 + Math.floor(Math.random() * 4)],
    [1, 3, 2 + Math.floor(Math.random() * 4)],
    [3, 2, -1 - Math.floor(Math.random() * 3)],
    [2, 4, 2 + Math.floor(Math.random() * 4)],

  ];

function randomGraph(){
  var n = 6 + Math.floor(Math.random()*3);
  var edges = [];
  var has = new Set();
  function add(u,v,w){
    if(u===v) return false;
    var k = edgeKey(u,v);
    if(has.has(k)) return false;
    has.add(k); edges.push([u,v,w]); return true;
  }
  function weight(){ return 1 + Math.floor(Math.random()*9); }
  for(var v=2; v<=n; v++){
    var u = 1 + Math.floor(Math.random()*(v-1));
    add(u, v, weight());
  }
  var extra = Math.floor(n*0.7), guard = 0;
  while(extra > 0 && guard++ < 300){
    var a = 1 + Math.floor(Math.random()*n);
    var b = 1 + Math.floor(Math.random()*n);
    if(add(a, b, weight())) extra--;
  }
  return { n:n, edges:edges, pos:null };
}

/* =========================================================
   3. 模拟器：每个课时生成一串 step
   step = { line, note, events[] }
   ========================================================= */

function simStore(g, mode){
  var steps = [];
  function push(line, note, events){ steps.push({line:line, note:note||"", events:events||[]}); }
  var m = g.edges.length;

  if(mode === "adj"){
    push(0, "准备存图：先读入点数 n 和边数 m");
    push(1, "n = "+g.n+"，m = "+m+"，下面要把 "+m+" 条无向边存下来", [{t:"n", n:g.n}]);
    push(2, "给 1.."+g.n+" 每个点分配一个空的出边表 g[i]");
    for(var i=0;i<m;i++){
      var e = g.edges[i], u=e[0], v=e[1], w=e[2];
      push(3, "第 "+(i+1)+" 轮循环：i = "+i+" < "+m);
      push(5, "读入一条边："+u+" -- "+v+"（权值 "+w+"）");
      push(6, "g["+u+"].push_back({"+v+", "+w+"})：u 的出边表末尾追加一条",
           [{t:"edge", u:u, v:v, w:w}, {t:"adjPush", u:u, v:v, w:w}]);
      push(7, "g["+v+"].push_back({"+u+", "+w+"})：无向图，反向也要存一条",
           [{t:"adjPush", u:v, v:u, w:w}]);
    }
    push(3, "循环结束，所有边都存好了");
    push(9, "存图完成："+m+" 条无向边 -> "+(2*m)+" 条有向邻接边");
  }

  if(mode === "mat"){
    push(0, "n = "+g.n+"，m = "+m+"；N 是数组能容纳的最大点数", [{t:"n", n:g.n}]);
    push(1, "声明二维数组 a[N][N]");
    push(2, "memset 清零：0 表示两点之间没有边");
    for(var i=0;i<m;i++){
      var e = g.edges[i], u=e[0], v=e[1], w=e[2];
      push(3, "第 "+(i+1)+" 轮循环：i = "+i+" < "+m);
      push(5, "读入一条边："+u+" -- "+v+"（权值 "+w+"）");
      push(6, "a["+u+"]["+v+"] = "+w+"：一条边只占一个格子",
           [{t:"edge", u:u, v:v, w:w}, {t:"matSet", u:u, v:v, w:w}]);
      push(7, "a["+v+"]["+u+"] = "+w+"：无向图填对称位置",
           [{t:"matSet", u:v, v:u, w:w}]);
    }
    push(3, "循环结束");
    push(9, "存图完成。查一条边是 O(1)，但遍历一个点的出边要扫一整行，O(n)");
  }

  if(mode === "fs"){
    push(0, "n = "+g.n+"，m = "+m+"；tot 从 0 开始，边从 1 开始编号", [{t:"n", n:g.n}]);
    push(1, "head[1..n] 全部置 -1：每个点暂时没有出边");

    var head = {}, tot = 0;
    for(var i=1;i<=g.n;i++) head[i] = -1;

    for(var i=0;i<m;i++){
      var e = g.edges[i], u=e[0], v=e[1], w=e[2];
      push(9, "第 "+(i+1)+" 轮循环：处理一条新的无向边");
      push(10, "读入："+u+" -- "+v+"（权值 "+w+"）");

      tot++;
      push(4, "add("+u+","+v+","+w+")：to["+tot+"] = "+v+"，wt["+tot+"] = "+w,
           [{t:"edge", u:u, v:v, w:w}, {t:"fsNew", u:u, v:v, w:w}]);
      push(5, "nxt["+tot+"] = head["+u+"] = "+head[u]+"，接在原来的表头前面", [{t:"fsNxt", u:u}]);
      head[u] = tot;
      push(6, "head["+u+"] = "+tot+"，表头指向新边", [{t:"fsHead", u:u}]);

      tot++;
      push(4, "add("+v+","+u+","+w+")：反向边 to["+tot+"] = "+u,
           [{t:"fsNew", u:v, v:u, w:w}]);
      push(5, "nxt["+tot+"] = head["+v+"] = "+head[v], [{t:"fsNxt", u:v}]);
      head[v] = tot;
      push(6, "head["+v+"] = "+tot, [{t:"fsHead", u:v}]);
    }
    push(13, "存图完成：每条无向边用两条有向边表示，编号 1.."+(2*m));
  }

  return steps;
}

function simDFS(g){
  var adj = buildAdj(g);
  var steps = [];
  function push(line, note, events){ steps.push({line:line, note:note||"", events:events||[]}); }
  var vis = new Set();

  push(0, "图 g 已经用邻接表存好，vis 里全是 0");

  function dfs(u){
    vis.add(u);
    push(1, "调用 dfs("+u+")，压入调用栈", [{t:"enter", u:u}]);
    push(2, "vis["+u+"] = 1：标记 "+u+" 已访问", [{t:"visit", u:u}]);
    push(3, "order.push_back("+u+")：记录访问顺序");

    var nb = adj.get(u);
    for(var j=0;j<nb.length;j++){
      var v = nb[j][0], w = nb[j][1];
      push(4, "看 "+u+" 的第 "+(j+1)+" 条邻边："+u+" -- "+v+"（权值 "+w+"）",
           [{t:"iter", i:j, v:v}, {t:"hi", hi:[u,v]}]);
      if(!vis.has(v)){
        push(5, "vis["+v+"] == 0，可以继续深入");
        dfs(v);
      }else{
        push(5, "vis["+v+"] == 1，这条边跳过");
      }
    }
    push(9, "dfs("+u+") 结束，回溯到上一层", [{t:"exit"}, {t:"hi", hi:null}]);
  }

  dfs(1);
  push(9, "DFS 结束，访问顺序就是 order 里的顺序");
  return steps;
}

function simBFS(g){
  var adj = buildAdj(g);
  var steps = [];
  function push(line, note, events){ steps.push({line:line, note:note||"", events:events||[]}); }

  var vis = new Set(), dist = {}, q = [];

  push(0, "vis 全 0，dist 全 -1");
  push(1, "准备一个空队列");
  vis.add(1); dist[1] = 0; q.push(1);
  push(2, "起点 1 入队：vis[1] = 1，dist[1] = 0",
       [{t:"visit", u:1}, {t:"dist", u:1, val:0}, {t:"qpush", u:1}, {t:"cur", u:1}]);

  while(q.length){
    push(3, "队列不为空，继续循环");
    var u = q.shift();
    push(4, "取出队首 "+u+"（先进先出）", [{t:"qpop"}, {t:"cur", u:u}]);
    var nb = adj.get(u);
    for(var j=0;j<nb.length;j++){
      var v = nb[j][0], w = nb[j][1];
      push(5, "检查 "+u+" 的邻边："+u+" -- "+v+"（权值 "+w+"）", [{t:"hi", hi:[u,v]}]);
      if(!vis.has(v)){
        vis.add(v); dist[v] = dist[u] + 1; q.push(v);
        push(6, "vis["+v+"] == 0，第一次到达 "+v);
        push(7, "vis["+v+"] = 1：标记已访问", [{t:"visit", u:v}]);
        push(8, "dist["+v+"] = dist["+u+"] + 1 = "+dist[v], [{t:"dist", u:v, val:dist[v]}]);
        push(9, "q.push("+v+")：入队，之后按层处理", [{t:"qpush", u:v}]);
      }else{
        push(6, "vis["+v+"] == 1，"+v+" 已经访问过，跳过");
      }
    }
    push(5, "u = "+u+" 的邻边检查完了", [{t:"hi", hi:null}]);
  }
  push(3, "队列空了，BFS 结束");
  push(3, "每个点第一次被访问时的 dist，就是它到 1 的最短边数");
  return steps;
}

function simDijkstra(g){
  var adj = buildAdj(g);
  var steps = [];
  function push(line, note, events){ steps.push({line:line, note:note||"", events:events||[]}); }

  var INF = Infinity;
  var dist = {}, heap = [];
  for(var i=1;i<=g.n;i++) dist[i] = INF;

  push(0, "INF 表示不可达（代码里是 0x3f3f3f3f）", [{t:"n", n:g.n}]);
  push(2, "dist 全部 INF，vis 全部 0");
  push(3, "声明小根堆 pq：每次都能取出距离最小的元素");

  dist[1] = 0;
  heap.push({d:0, u:1});
  push(4, "起点 1：dist[1] = 0，把 (0,1) 入堆",
       [{t:"dist", u:1, val:0}, {t:"hp", d:0, u:1}, {t:"stat", k:"push"}]);

  while(heap.length){
    heap.sort(function(a,b){ return a.d - b.d || a.u - b.u; });
    push(5, "堆里有 " + heap.length + " 个元素，继续");

    var top = heap[0];
    push(6, "取出堆顶 (" + top.d + "," + top.u + ")：当前距离最小的点",
         [{t:"hpPop", u:top.u}, {t:"cur", u:top.u}, {t:"stat", k:"pop"}]);

    var d = top.d, u = top.u;
    if(d > dist[u]){
      heap.shift();
      push(7, "d = " + d + " 比 dist[" + u + "] = " + dist[u] + " 大，是过期元素，跳过");
      continue;
    }
    heap.shift();
    push(8, "vis[" + u + "] = 1：" + u + " 的最短路已经确定，之后不会再变", [{t:"settle", u:u}]);

    var nb = adj.get(u);
    for(var j=0;j<nb.length;j++){
      var v = nb[j][0], w = nb[j][1];
      push(9, "看 " + u + " 的邻边：" + u + " -- " + v + "（w=" + w + "）",
           [{t:"hi", hi:[u,v]}, {t:"stat", k:"scan"}]);
      var nd = dist[u] + w;
      var old = dist[v];
      if(nd < old){
        push(10, "dist[" + u + "] + " + w + " = " + nd + " < dist[" + v + "] = " + (old === INF ? "∞" : old) + "，可以更优");
        dist[v] = nd;
        push(11, "更新 dist[" + v + "] = " + nd, [{t:"dist", u:v, val:nd}, {t:"stat", k:"relax"}]);
        heap.push({d:nd, u:v});
        push(12, "把 (" + nd + "," + v + ") 入堆，之后可能用它继续松弛",
             [{t:"hp", d:nd, u:v}, {t:"stat", k:"push"}]);
      }else{
        push(10, "dist[" + u + "] + " + w + " = " + nd + " ≥ dist[" + v + "] = " + (old === INF ? "∞" : old) + "，不更新");
      }
    }
    push(9, u + " 的邻边处理完了", [{t:"hi", hi:null}]);
  }
  push(5, "堆空了，所有可达点的最短路都已确定");
  push(15, "dist 数组就是答案：从 1 到每个点的最短距离");
  return steps;
}

function simKruskal(g){
  var steps = [];
  function push(line, note, events){ steps.push({line:line, note:note||"", events:events||[]}); }

  var list = g.edges.map(function(e, i){ return {u:e[0], v:e[1], w:e[2], idx:i}; })
                    .sort(function(a,b){ return a.w - b.w || a.idx - b.idx; });
  var p = {}, sz = {};

  push(0, "定义边的结构体：u、v、w");
  push(1, "读入 " + g.edges.length + " 条边", [{t:"n", n:g.n}]);
  push(2, "按权值从小到大排序：Kruskal 就是「先试最小的边」");
  push(7, "并查集初始化：每个点各自是一个集合", [{t:"dsuInit", n:g.n}]);
  for(var i=1;i<=g.n;i++){ p[i] = i; sz[i] = 1; }

  function find(x){
    if(p[x] === x){
      push(10, "find(" + x + ")：p[" + x + "] = " + x + "，它就是根", []);
      return x;
    }
    push(11, "find(" + x + ")：p[" + x + "] = " + p[x] + "，还没到根，继续往上找", []);
    var r = find(p[x]);
    if(p[x] !== r){
      p[x] = r;
      push(11, "路径压缩：让 p[" + x + "] 直接指向根 " + r, [{t:"setParent", x:x, p:r}]);
    }
    return r;
  }

  function unite(u, v, idx, w){
    push(15, "尝试边 " + u + " -- " + v + "（w=" + w + "）：先查两端属于哪个集合");
    var a = find(u);
    var b = find(v);
    push(15, "两端的根：a = " + a + "，b = " + b);
    if(a === b){
      push(16, "a == b，" + u + " 和 " + v + " 已经连通，这条边会成环，跳过", [{t:"kruSkip", i:idx}]);
      return false;
    }
    if(sz[a] < sz[b]){
      var t = a; a = b; b = t;
      push(17, "sz[" + b + "] 更小，交换 a、b：把小集合挂到大集合下面", []);
    }else{
      push(17, "sz[" + a + "] ≥ sz[" + b + "]，保持 a 作为新的根", []);
    }
    p[b] = a; sz[a] += sz[b];
    push(18, "p[" + b + "] = " + a + "，sz[" + a + "] = " + sz[a],
         [{t:"setParent", x:b, p:a}, {t:"setSize", x:a, s:sz[a]}]);
    return true;
  }

  var mst = 0, cnt = 0;
  for(var i=0;i<list.length;i++){
    var e = list[i];
    push(23, "第 " + (i+1) + " 条边：" + e.u + " -- " + e.v + "（w=" + e.w + "）",
         [{t:"curEdge", i:e.idx, u:e.u, v:e.v, w:e.w}, {t:"hi", hi:[e.u, e.v]}]);
    if(unite(e.u, e.v, e.idx, e.w)){
      mst += e.w; cnt++;
      push(24, "选中这条边：mst = " + mst + "，已选 " + cnt + " 条",
           [{t:"mstAdd", i:e.idx, u:e.u, v:e.v, w:e.w}]);
    }
  }
  push(24, "最小生成树完成：总权值 " + mst + "，共 " + cnt + " 条边", [{t:"hi", hi:null}]);
  return steps;
}

function simBubble(arr){
  var steps = [];
  function push(line, note, events){ steps.push({line:line, note:note||"", events:events||[]}); }
  var a = (arr.values || []).slice();
  var n = a.length;

  push(0, "对 " + n + " 个数做冒泡排序：每一轮把当前最大的数冒到末尾", [{t:"arrInit", values:a.slice()}]);
  for(var i=0;i<n-1;i++){
    push(0, "第 " + (i+1) + " 轮：比较范围缩小到 0.." + (n-1-i), []);
    push(1, "先假设这一轮不会发生交换", []);
    var swapped = false;
    for(var j=0;j<n-1-i;j++){
      push(2, "j = " + j + "：比较 a[" + j + "] 和 a[" + (j+1) + "]",
           [{t:"clear"}, {t:"ptr", name:"j", i:j}]);
      push(3, "a[" + j + "] = " + a[j] + "，a[" + (j+1) + "] = " + a[j+1],
           [{t:"cmp", i:j, j:j+1}, {t:"stat", k:"cmp"}]);
      if(a[j] > a[j+1]){
        var x = a[j], y = a[j+1];
        a[j] = y; a[j+1] = x;
        swapped = true;
        push(4, x + " > " + y + "，逆序，交换这两个数",
             [{t:"swap", i:j, j:j+1}, {t:"stat", k:"swap"}]);
        push(5, "swapped = true，记录这一轮发生过交换");
      }else{
        push(3, "顺序正确，不动", [{t:"clear"}]);
      }
    }
    push(7, "第 " + (i+1) + " 轮结束：a[" + (n-1-i) + "] = " + a[n-1-i] + " 已经就位",
         [{t:"clear"}, {t:"sorted", i:n-1-i}]);
    if(!swapped){
      push(8, "整轮没有交换，剩下的已经有序，提前结束");
      break;
    }
  }
  var evs = [{t:"clear"}];
  for(var k=0;k<n;k++) evs.push({t:"sorted", i:k});
  push(9, "排序完成：数组从小到大有序", evs);
  return steps;
}

function simBinary(arr){
  var steps = [];
  function push(line, note, events){ steps.push({line:line, note:note||"", events:events||[]}); }
  var a = (arr.values || []).slice();
  var n = a.length;
  var target = arr.target;
  var lo = 0, hi = n - 1;

  push(0, "在有序数组里查找 " + target, [{t:"arrInit", values:a.slice()}, {t:"target", v:target}]);
  push(0, "lo = 0，hi = " + hi + "：一开始整个数组都是候选区间",
       [{t:"ptr", name:"lo", i:0}, {t:"ptr", name:"hi", i:hi}, {t:"window", lo:0, hi:hi}]);

  while(lo <= hi){
    push(1, "lo = " + lo + " ≤ hi = " + hi + "，区间里还有 " + (hi - lo + 1) + " 个数",
         [{t:"window", lo:lo, hi:hi}]);
    var mid = (lo + hi) >> 1;
    push(2, "mid = (" + lo + " + " + hi + ") / 2 = " + mid + "，看 a[" + mid + "] = " + a[mid],
         [{t:"ptr", name:"mid", i:mid}]);
    if(a[mid] === target){
      push(3, "a[" + mid + "] == " + target + "，找到了！", [{t:"found", i:mid}]);
      push(7, "返回下标 " + mid);
      return steps;
    }
    if(a[mid] < target){
      push(4, "a[" + mid + "] = " + a[mid] + " < " + target + "：答案只能在右半边",
           [{t:"clear"}, {t:"ptr", name:"mid", i:-1}]);
      lo = mid + 1;
      push(4, "lo = mid + 1 = " + lo,
           [lo <= hi ? {t:"window", lo:lo, hi:hi} : {t:"window", lo:null}, {t:"ptr", name:"lo", i:lo}]);
    }else{
      push(5, "a[" + mid + "] = " + a[mid] + " > " + target + "：答案只能在左半边",
           [{t:"clear"}, {t:"ptr", name:"mid", i:-1}]);
      hi = mid - 1;
      push(5, "hi = mid - 1 = " + hi,
           [lo <= hi ? {t:"window", lo:lo, hi:hi} : {t:"window", lo:null}, {t:"ptr", name:"hi", i:hi}]);
    }
  }
  push(6, "lo = " + lo + " > hi = " + hi + "，区间空了：数组里没有 " + target,
       [{t:"window", lo:null}, {t:"ptr", name:"lo", i:-1}, {t:"ptr", name:"hi", i:-1}, {t:"ptr", name:"mid", i:-1}]);
  push(7, "返回 -1");
  return steps;
}

function simQuick(arr){
  var steps = [];
  function push(line, note, events){ steps.push({line:line, note:note||"", events:events||[]}); }
  var a = (arr.values || []).slice();
  var n = a.length;

  push(0, "对区间 [0, " + (n-1) + "] 快速排序：选基准，把小的放左边、大的放右边", [{t:"arrInit", values:a.slice()}]);

  function qs(l, r){
    if(l > r) return;
    push(0, "进入 quick_sort(" + l + ", " + r + ")", [{t:"rpush", lo:l, hi:r}]);
    if(l === r){
      push(1, "区间只有一个数 a[" + l + "]，它已经在最终位置", [{t:"sorted", i:l}]);
      push(12, "返回上一层", [{t:"rpop"}]);
      return;
    }
    var p = a[r];
    push(2, "选 a[" + r + "] = " + p + " 作为基准", [{t:"pivot", i:r}]);
    var i = l;
    push(3, "i = " + l + "：小于基准的区域暂时是空的", [{t:"ptr", name:"i", i:i}]);
    for(var j=l;j<r;j++){
      push(4, "j = " + j + "，看 a[" + j + "] = " + a[j],
           [{t:"clear"}, {t:"ptr", name:"j", i:j}]);
      push(5, (a[j] < p ? a[j] + " < " + p + "，它应该去左边" : a[j] + " ≥ " + p + "，它留在右边"),
           [{t:"cmp", i:j, j:r}, {t:"stat", k:"cmp"}]);
      if(a[j] < p){
        if(i !== j){ var t = a[i]; a[i] = a[j]; a[j] = t; }
        push(6, "交换 a[" + i + "] 和 a[" + j + "]，i 右移",
             [{t:"swap", i:i, j:j}, {t:"stat", k:"swap"}]);
        i++;
        push(6, "现在 i = " + i + "，小于基准的区域扩大了一格", [{t:"ptr", name:"i", i:i}]);
      }
    }
    if(i !== r){ var t2 = a[i]; a[i] = a[r]; a[r] = t2; }
    push(9, "把基准换到 i = " + i + "：左边都小于它，右边都不小于它",
         [{t:"swap", i:i, j:r}, {t:"pivot", i:-1}, {t:"sorted", i:i}]);
    qs(l, i - 1);
    qs(i + 1, r);
    push(12, "区间 [" + l + ", " + r + "] 处理完成，返回上一层", [{t:"rpop"}]);
  }

  qs(0, n - 1);
  push(12, "排序完成", [{t:"clear"}, {t:"pivot", i:-1}]);
  return steps;
}

function simMerge(arr){
  var steps = [];
  function push(line, note, events){ steps.push({line:line, note:note||"", events:events||[]}); }
  var a = (arr.values || []).slice();
  var n = a.length;
  var tmp = new Array(n).fill(null);

  push(0, "归并排序：先一路分到只剩一个元素，再两两合并", [{t:"arrInit", values:a.slice()}, {t:"auxInit", n:n}]);

  function ms(l, r){
    if(l >= r) return;
    push(0, "进入 merge_sort(" + l + ", " + r + ")", [{t:"rpush", lo:l, hi:r}]);
    var mid = (l + r) >> 1;
    push(2, "mid = (" + l + " + " + r + ") / 2 = " + mid + "，分成 [" + l + "," + mid + "] 和 [" + (mid+1) + "," + r + "]");
    ms(l, mid);
    ms(mid + 1, r);

    var i = l, j = mid + 1, k = l;
    push(5, "合并两段：i = " + i + "，j = " + j + "，k = " + k,
         [{t:"window", lo:l, hi:r}, {t:"ptr", name:"i", i:i}, {t:"ptr", name:"j", i:j}]);
    while(i <= mid && j <= r){
      push(6, "两段都还有数，取较小的那个", []);
      push(7, "比较 a[" + i + "] = " + a[i] + " 和 a[" + j + "] = " + a[j],
           [{t:"cmp", i:i, j:j}, {t:"stat", k:"cmp"}]);
      if(a[i] <= a[j]){
        tmp[k] = a[i];
        push(7, "a[" + i + "] 更小，写进 tmp[" + k + "]，i 右移",
             [{t:"auxSet", i:k, v:a[i]}, {t:"ptr", name:"i", i:i+1}, {t:"stat", k:"move"}]);
        i++;
      }else{
        tmp[k] = a[j];
        push(8, "a[" + j + "] 更小，写进 tmp[" + k + "]，j 右移",
             [{t:"auxSet", i:k, v:a[j]}, {t:"ptr", name:"j", i:j+1}, {t:"stat", k:"move"}]);
        j++;
      }
      k++;
    }
    while(i <= mid){
      tmp[k] = a[i];
      push(10, "右半段空了，把左半段剩下的 a[" + i + "] 直接搬过去",
           [{t:"auxSet", i:k, v:a[i]}, {t:"ptr", name:"i", i:i+1}, {t:"stat", k:"move"}]);
      i++; k++;
    }
    while(j <= r){
      tmp[k] = a[j];
      push(11, "左半段空了，把右半段剩下的 a[" + j + "] 直接搬过去",
           [{t:"auxSet", i:k, v:a[j]}, {t:"ptr", name:"j", i:j+1}, {t:"stat", k:"move"}]);
      j++; k++;
    }
    push(12, "两段都取完了，现在把 tmp 搬回 a[" + l + ".." + r + "]",
         [{t:"clear"}, {t:"ptr", name:"i", i:-1}, {t:"ptr", name:"j", i:-1}]);
    for(var t = l; t <= r; t++){
      a[t] = tmp[t];
      push(12, "把 tmp[" + t + "] = " + tmp[t] + " 写回 a[" + t + "]",
           [{t:"setMain", i:t, v:tmp[t]}, {t:"stat", k:"move"}]);
    }
    push(12, "区间 [" + l + ", " + r + "] 已整体有序，返回上一层", [{t:"clear"}, {t:"rpop"}]);
  }

  ms(0, n - 1);

  var evs = [{t:"clear"}];
  for(var q=0;q<n;q++) evs.push({t:"sorted", i:q});
  push(12, "排序完成：整个数组有序", evs);
  return steps;
}

function simPrefix(arr){
  var steps = [];
  function push(line, note, events){ steps.push({line:line, note:note||"", events:events||[]}); }
  var a = (arr.values || []).slice();
  var n = a.length;
  var pre = new Array(n).fill(0);

  push(0, "要反复查询区间和：先花 O(n) 预处理出前缀和", [{t:"arrInit", values:a.slice()}, {t:"auxInit", n:n}]);

  pre[0] = a[0];
  push(1, "pre[0] = a[0] = " + a[0], [{t:"auxSet", i:0, v:pre[0]}]);

  for(var i=1;i<n;i++){
    pre[i] = pre[i-1] + a[i];
    push(2, "i = " + i + "：pre[" + i + "] = pre[" + (i-1) + "] + a[" + i + "]");
    push(3, "= " + pre[i-1] + " + " + a[i] + " = " + pre[i],
         [{t:"auxSet", i:i, v:pre[i]}, {t:"ptr", name:"i", i:i}]);
  }

  var l = 2, r = Math.min(n - 1, 5);
  if(n < 6){ l = 1; r = n - 2; }
  var left = (l === 0) ? 0 : pre[l-1];
  push(4, "查询 a[" + l + ".." + r + "] 的和：只要两个前缀和相减",
       [{t:"window", lo:l, hi:r}, {t:"ptr", name:"i", i:-1}]);
  push(5, "sum = pre[" + r + "] - pre[" + (l-1) + "] = " + pre[r] + " - " + left + " = " + (pre[r] - left),
       [{t:"auxMark", a:r, b:l-1}, {t:"query", l:l, r:r, v:pre[r] - left}]);
  return steps;
}

function simDiff(arr){
  var steps = [];
  function push(line, note, events){ steps.push({line:line, note:note||"", events:events||[]}); }
  var a = (arr.values || []).slice();
  var n = a.length;
  var d = new Array(n).fill(0);

  push(0, "差分数组 d 初始全 0：它记录的是「变化量」", [{t:"arrInit", values:a.slice()}, {t:"auxInit", n:n}]);

  var l = 2, r = Math.min(n - 1, 5), v = 6;
  if(n < 6){ l = 1; r = n - 2; }

  d[l] += v;
  push(2, "要让 a[" + l + ".." + r + "] 全部加 " + v + "：只在 d[" + l + "] 加 " + v,
       [{t:"auxSet", i:l, v:d[l]}, {t:"window", lo:l, hi:r}]);
  if(r + 1 < n){
    d[r + 1] -= v;
    push(3, "再在 d[" + (r+1) + "] 减 " + v + "：把影响在右边界外抵消掉",
         [{t:"auxSet", i:r+1, v:d[r+1]}]);
  }

  for(var i=1;i<n;i++){
    d[i] += d[i-1];
    push(5, "前缀和还原：d[" + i + "] += d[" + (i-1) + "] → " + d[i],
         [{t:"auxSet", i:i, v:d[i]}, {t:"ptr", name:"i", i:i}]);
  }

  for(var i=0;i<n;i++){
    a[i] += d[i];
    push(6, "a[" + i + "] += d[" + i + "] → " + a[i],
         [{t:"clear"}, {t:"setMain", i:i, v:a[i]}]);
  }
  push(6, "区间修改完成：只有 a[" + l + ".." + r + "] 变了，其他位置没动", [{t:"clear"}, {t:"ptr", name:"i", i:-1}]);
  return steps;
}

function simKnap(arr, full){
  var steps = [];
  function push(line, note, events){ steps.push({line:line, note:note||"", events:events||[]}); }

  var items = arr.items || [[2,3],[3,4],[4,5],[5,6]];
  var W = arr.W || 8;
  var n = items.length;
  var dp = [];
  for(var i=0;i<=n;i++){
    var row = [];
    for(var j=0;j<=W;j++) row.push(0);
    dp.push(row);
  }

  push(0, "dp[0][j] = 0：一个物品都不选，价值是 0", [{t:"gridInit", rows:n+1, cols:W+1}]);
  var z = [];
  for(var j=0;j<=W;j++) z.push({t:"cell", i:0, j:j, v:0});
  push(0, "第 0 行全部填 0", z);

  for(var i=1;i<=n;i++){
    var w = items[i-1][0], v = items[i-1][1];
    push(1, "第 " + i + " 个物品：重量 " + w + "，价值 " + v);
    for(var j=0;j<=W;j++){
      dp[i][j] = dp[i-1][j];
      push(3, "j = " + j + "：不选它，dp[" + i + "][" + j + "] = dp[" + (i-1) + "][" + j + "] = " + dp[i][j],
           [{t:"focus", i:i, j:j}, {t:"deps", cells:[[i-1, j]]}, {t:"cell", i:i, j:j, v:dp[i][j]}]);
      if(j >= w){
        var src = full ? dp[i][j-w] : dp[i-1][j-w];
        var alt = src + v;
        push(5, "装得下：选它 = dp[" + (full ? i : i-1) + "][" + (j-w) + "] + " + v + " = " + src + " + " + v + " = " + alt,
             [{t:"deps", cells:[[i-1, j], [full ? i : i-1, j-w]]}]);
        if(alt > dp[i][j]){
          var old = dp[i][j];
          dp[i][j] = alt;
          push(6, alt + " > " + old + "，更新 dp[" + i + "][" + j + "] = " + alt,
               [{t:"cell", i:i, j:j, v:alt}]);
        }else{
          push(6, alt + " 没有更大，保持 " + dp[i][j]);
        }
      }else{
        push(4, "j = " + j + " < " + w + "，装不下，只能不选");
      }
    }
  }
  push(10, "答案是 dp[" + n + "][" + W + "] = " + dp[n][W], [{t:"dpClear"}]);
  return steps;
}

function simTopo(g){
  var steps = [];
  function push(line, note, events){ steps.push({line:line, note:note||"", events:events||[]}); }
  var n = g.n;
  var adj = new Map();
  for(var i=1;i<=n;i++) adj.set(i, []);
  for(var k=0;k<g.edges.length;k++){
    adj.get(g.edges[k][0]).push(g.edges[k][1]);
  }
  var indeg = {};
  for(var i=1;i<=n;i++) indeg[i] = 0;

  var init = [{t:"n", n:n}];
  for(var i=1;i<=n;i++) init.push({t:"deg", u:i, v:0});
  push(0, "统计每个点的入度：有多少条边指向它", init);
  for(var k=0;k<g.edges.length;k++){
    var u = g.edges[k][0], v = g.edges[k][1];
    indeg[v]++;
    push(1, "边 " + u + " → " + v + "：indeg[" + v + "] = " + indeg[v],
         [{t:"deg", u:v, v:indeg[v]}]);
  }

  push(2, "准备一个队列，先把所有入度为 0 的点放进去");
  var q = [];
  for(var i=1;i<=n;i++){
    if(indeg[i] === 0){
      q.push(i);
      push(4, i + " 的入度是 0：它没有前置任务，可以入队", [{t:"qpush", u:i}]);
    }
  }
  push(4, "所有入度为 0 的点都已入队");

  var order = [];
  while(q.length){
    push(5, "队列不为空，继续");
    var x = q.shift();
    push(6, "取出队首 " + x, [{t:"qpop"}, {t:"cur", u:x}]);
    order.push(x);
    push(7, x + " 的输出时机成熟：加入拓扑序", [{t:"visit", u:x}]);

    var nb = adj.get(x);
    for(var j=0;j<nb.length;j++){
      var y = nb[j];
      push(8, "删掉 " + x + " → " + y + " 这条边", [{t:"hi", hi:[x,y]}]);
      indeg[y]--;
      if(indeg[y] === 0){
        q.push(y);
        push(9, "indeg[" + y + "] 减到 0，入队", [{t:"deg", u:y, v:0}, {t:"qpush", u:y}, {t:"hi", hi:null}]);
      }else{
        push(9, "indeg[" + y + "] = " + indeg[y] + "，还有前置任务，先不入队",
             [{t:"deg", u:y, v:indeg[y]}, {t:"hi", hi:null}]);
      }
    }
  }

  push(11, "队列空了：拓扑序是 [" + order.join(", ") + "]");
  push(12, order.length === n
    ? "一共输出了 " + order.length + " 个点，等于 n：图里没有环"
    : "只输出了 " + order.length + " 个点，小于 n：图里有环，不存在拓扑序");
  return steps;
}

function simMono(arr){
  var steps = [];
  function push(line, note, events){ steps.push({line:line, note:note||"", events:events||[]}); }
  var a = (arr.values || []).slice();
  var n = a.length;
  var stk = [];

  push(0, "栈里存的是下标，它们对应的值从栈底到栈顶单调递减", [{t:"arrInit", values:a.slice()}]);

  for(var i=0;i<n;i++){
    push(1, "i = " + i + "，a[" + i + "] = " + a[i], [{t:"clear"}, {t:"ptr", name:"i", i:i}]);

    while(true){
      if(!stk.length){
        push(2, "栈空了，while 结束", [{t:"cmp", i:i, j:-1}]);
        break;
      }
      var t = stk[stk.length-1];
      if(a[t] < a[i]){
        push(2, "栈顶 a[" + t + "] = " + a[t] + " < a[" + i + "] = " + a[i] + "：它等到了更大的数",
             [{t:"cmp", i:i, j:t}]);
        push(3, "弹出 " + t + "：以后再也不会用到它了", [{t:"spop"}, {t:"cmp", i:i, j:-1}]);
        stk.pop();
      }else{
        push(2, "a[" + t + "] = " + a[t] + " ≥ a[" + i + "] = " + a[i] + "，停止弹栈",
             [{t:"cmp", i:i, j:t}]);
        break;
      }
    }

    if(stk.length){
      push(5, "栈顶 " + stk[stk.length-1] + " 就是 a[" + i + "] 左边第一个更大元素",
           [{t:"ans", i:i, v:stk[stk.length-1]}]);
    }else{
      push(5, "栈空了：a[" + i + "] 左边没有更大的元素", [{t:"ans", i:i, v:-1}]);
    }
    stk.push(i);
    push(6, "把下标 " + i + " 压入栈", [{t:"spush", i:i}, {t:"cmp", i:i, j:-1}]);
  }
  push(7, "结束：ans[i] 记录每个位置左边第一个更大元素的下标", [{t:"clear"}, {t:"ptr", name:"i", i:-1}]);
  return steps;
}

function fmtINF(v){ return v === Infinity ? "∞" : v; }

function simFloyd(data){
  var steps = [];
  function push(line, note, events){ steps.push({line:line, note:note||"", events:events||[]}); }
  var n = data.n || 4;
  var edges = data.edges || [];
  var d = [];
  for(var i=0;i<n;i++){
    var row = [];
    for(var j=0;j<n;j++) row.push(i === j ? 0 : Infinity);
    d.push(row);
  }

  push(0, "d[i][j] 表示 i 到 j 的当前最短距离（∞ 表示还不连通）", [{t:"gridInit", rows:n, cols:n}]);
  var evs = [];
  for(var i=0;i<n;i++) for(var j=0;j<n;j++) evs.push({t:"cell", i:i, j:j, v:d[i][j]});
  push(3, "初始化：自己到自己 0，其余先当 ∞", evs);

  for(var e=0;e<edges.length;e++){
    var u = edges[e][0], v = edges[e][1], w = edges[e][2];
    d[u][v] = w; d[v][u] = w;
    push(4, "读入边 " + u + " -- " + v + "（权值 " + w + "）",
         [{t:"cell", i:u, j:v, v:w}, {t:"cell", i:v, j:u, v:w}]);
  }

  for(var k=0;k<n;k++){
    push(5, "第 " + (k+1) + " 轮：允许经过 " + k + " 号点中转");
    for(var i=0;i<n;i++){
      for(var j=0;j<n;j++){
        if(i === j) continue;
        var cur = d[i][j];
        var alt = d[i][k] + d[k][j];
        push(8, "d[" + i + "][" + j + "] = min(" + fmtINF(cur) + ", d[" + i + "][" + k + "] + d[" + k + "][" + j + "] = " + fmtINF(alt) + ")",
             [{t:"focus", i:i, j:j}, {t:"deps", cells:[[i,k],[k,j]]}]);
        if(alt < cur){
          d[i][j] = alt;
          push(8, "经过 " + k + " 更短：d[" + i + "][" + j + "] 更新为 " + fmtINF(alt),
               [{t:"cell", i:i, j:j, v:alt}]);
        }
      }
    }
  }
  push(9, "结束：表里每个格子都是两点之间的最短路", [{t:"dpClear"}]);
  return steps;
}

function simHeap(arr){
  var steps = [];
  function push(line, note, events){ steps.push({line:line, note:note||"", events:events||[]}); }
  var vals = arr.values || [5,3,8,1,9,2,7];
  var h = [0];

  push(0, "h[0] 空着不用，堆的元素从下标 1 开始", [{t:"hinit"}, {t:"n", n:vals.length}]);

  for(var vi=0; vi<vals.length; vi++){
    var x = vals[vi];
    h.push(x);
    push(2, "插入 " + x + "：先放到数组末尾（也就是树的最后一个叶子）", [{t:"hpush", v:x}]);
    var i = h.length - 1;
    push(3, "i = " + i + "，开始向上调整", [{t:"hcur", i:i}]);

    while(true){
      if(i <= 1){
        push(4, "i = 1，已经到根，调整结束", [{t:"hcur", i:i}]);
        break;
      }
      var p = i >> 1;
      if(h[i] > h[p]){
        push(4, "h[" + i + "] = " + h[i] + " > 父节点 h[" + p + "] = " + h[p] + "，不满足大根堆",
             [{t:"hcur", i:i}]);
        var tv = h[i]; h[i] = h[p]; h[p] = tv;
        push(5, "交换 " + i + " 和 " + p + "：大的数往上冒", [{t:"hswap", i:i, j:p}, {t:"hcur", i:p}]);
        i = p;
        push(6, "i = i / 2 = " + i);
      }else{
        push(4, "h[" + i + "] = " + h[i] + " ≤ 父节点 h[" + p + "] = " + h[p] + "，已满足大根堆",
             [{t:"hcur", i:i}]);
        break;
      }
    }
  }
  push(8, "结束：这个数组就是一个合法的大根堆，根 h[1] 是最大值", [{t:"hcur", i:0}]);
  return steps;
}

function simMemo(arr){
  var steps = [];
  function push(line, note, events){ steps.push({line:line, note:note||"", events:events||[]}); }
  var N = arr.top || 8;
  var memo = new Array(N + 1).fill(0);

  push(0, "memo 全 0：0 表示这个子问题还没算过", [{t:"arrInit", values:memo.slice()}, {t:"n", n:N}]);

  function f(n){
    push(1, "调用 f(" + n + ")", [{t:"callPush", n:n}, {t:"pivot", i:n}]);
    if(n <= 2){
      memo[n] = n;
      push(2, "n = " + n + " ≤ 2，是边界，直接返回 " + n, [{t:"setMain", i:n, v:n}]);
      push(2, "f(" + n + ") 返回 " + n, [{t:"callPop"}]);
      return n;
    }
    if(memo[n]){
      push(3, "memo[" + n + "] = " + memo[n] + " 已经有值：命中缓存，不再往下递归", [{t:"found", i:n}]);
      push(3, "f(" + n + ") 返回 " + memo[n], [{t:"callPop"}]);
      return memo[n];
    }
    push(3, "memo[" + n + "] 还是 0，只能去问 f(" + (n-1) + ") 和 f(" + (n-2) + ")");
    var a = f(n - 1);
    var b = f(n - 2);
    memo[n] = a + b;
    push(4, "memo[" + n + "] = " + a + " + " + b + " = " + memo[n], [{t:"setMain", i:n, v:memo[n]}]);
    push(4, "f(" + n + ") 返回 " + memo[n], [{t:"callPop"}]);
    return memo[n];
  }

  f(N);

function simIdp(data){
  var steps = [];
  function push(line, note, events){ steps.push({line:line, note:note||"", events:events||[]}); }
  var a = (data && data.values) || [4,1,2,3,5,2];
  var n = a.length;
  var sum = [0];
  for(var i=0;i<n;i++) sum.push(sum[i] + a[i]);
  var dp = [];
  for(var i=0;i<n;i++){
    var row = [];
    for(var j=0;j<n;j++) row.push(null);
    dp.push(row);
  }

  push(0, "dp[l][r]：把第 l 到 r 堆石子合并成一堆，需要的最小代价", [{t:"gridInit", rows:n, cols:n}]);
  push(1, "先做前缀和：sum[i+1] = sum[i] + a[i]，后面 O(1) 求区间总重量");
  var evs = [];
  for(var i=0;i<n;i++){ dp[i][i] = 0; evs.push({t:"cell", i:i, j:i, v:0}); }
  push(6, "长度为 1 的区间不用合并，代价是 0（对角线）", evs);

  for(var len=2; len<=n; len++){
    push(2, "区间长度 len = " + len);
    for(var l=0; l + len - 1 < n; l++){
      var r = l + len - 1;
      dp[l][r] = Infinity;
      var range = sum[r+1] - sum[l];
      push(4, "右端点 r = " + r + "，这段的总重量 w = " + range,
           [{t:"focus", i:l, j:r}]);
      push(5, "w = sum[" + (r+1) + "] - sum[" + l + "] 已算好，接下来枚举切点",
           [{t:"focus", i:l, j:r}]);
      for(var k=l; k<r; k++){
        var cost = dp[l][k] + dp[k+1][r];
        push(8, "在 " + k + " 和 " + (k+1) + " 之间切开：dp[" + l + "][" + k + "] + dp[" + (k+1) + "][" + r + "] = " + cost,
             [{t:"focus", i:l, j:r}, {t:"deps", cells:[[l,k],[k+1,r]]}]);
        var val = cost + range;
        if(val < dp[l][r]){
          dp[l][r] = val;
          push(9, cost + " + " + range + " = " + val + "，更小，更新 dp[" + l + "][" + r + "]",
               [{t:"cell", i:l, j:r, v:val}]);
        }else{
          push(9, cost + " + " + range + " = " + val + "，没有更小，保持 " + dp[l][r]);
        }
      }
    }
  }
  push(12, "答案 dp[0][" + (n-1) + "] = " + dp[0][n-1], [{t:"dpClear"}]);
  return steps;
}

  push(6, "nxt 构造完成，开始用它在文本里找模式串", [{t:"top", which:"s"}]);

           [{t:"pos", i:i2, j:j2}]);
      j2 = nxt[j2-1];
      push(7, "回退后 j = " + j2, [{t:"pos", i:i2, j:j2}]);

    }

      push(9, "命中！模式串出现在下标 " + start, [{t:"hit", start:start}]);
      push(10, "记录答案 ans.push_back(" + start + ")", [{t:"hit", start:start}]);

function simBit(data){

       [{t:"arrInit", values:a.slice()}, {t:"auxInit", n:n}]);
  push(1, "从前往后建树：t[i] 先放 a[i-1]，再把 t[i] 贡献给它的父节点");

  for(var i=1;i<=n;i++){
    t[i] += a[i-1];

         [{t:"auxSet", i:i-1, v:t[i]}]);

    if(j <= n){
      t[j] += t[i];

  var r = n - 1, s = 0;

  for(var i=r;i>0;i-=i&-i){
    s += t[i];
    push(8, "i = " + i + "：加上 t[" + i + "] = " + t[i] + "，sum = " + s,
         [{t:"auxSet", i:i-1, v:t[i]}, {t:"ptr", name:"i", i:i-1}]);

function simSeg(data){
  var steps = [];
  function push(line, note, events){ steps.push({line:line, note:note||"", events:events||[]}); }
  var a = (data && data.values) || [5,3,8,1,9,2,7,4];
  var n = a.length;
  var tr = {};

  push(0, "线段树把数组切成一段段，tr[p] 存这个区间的和", [{t:"segInit", n:n}]);

  function build(p, l, r){
    push(1, "build(p=" + p + ", [" + l + "," + r + "])", [{t:"segCur", p:p}]);
    if(l === r){
      tr[p] = a[l];
      push(2, "叶子节点：tr[" + p + "] = a[" + l + "] = " + a[l],
           [{t:"segNode", p:p, l:l, r:r, v:a[l]}]);
      return;
    }
    var mid = (l + r) >> 1;
    push(3, "mid = " + mid + "：先建左孩子 [" + l + "," + mid + "]，再建右孩子");
    build(p*2, l, mid);
    build(p*2+1, mid+1, r);
    tr[p] = tr[p*2] + tr[p*2+1];
    push(6, "tr[" + p + "] = tr[" + (p*2) + "] + tr[" + (p*2+1) + "] = " + tr[p],
         [{t:"segNode", p:p, l:l, r:r, v:tr[p]}]);
  }
  build(1, 0, n-1);

  var ql = 2, qr = 5;
  push(8, "建好了，现在查询 a[" + ql + ".." + qr + "]", [{t:"segClear"}, {t:"segCur", p:0}]);
  function query(p, l, r){
    push(8, "query(p=" + p + ", [" + l + "," + r + "])", [{t:"segCur", p:p}]);
    if(ql <= l && r <= qr){
      push(9, "[" + l + "," + r + "] 整段都在查询范围内，直接拿 tr[" + p + "] = " + tr[p],
           [{t:"segMark", p:p, k:"full"}]);
      return tr[p];
    }
    var mid = (l + r) >> 1, s = 0;
    push(10, "只和 [" + ql + "," + qr + "] 部分重叠，继续往下分", [{t:"segMark", p:p, k:"part"}]);
    if(ql <= mid) s += query(p*2, l, mid);
    if(qr > mid) s += query(p*2+1, mid+1, r);
    return s;
  }
  var ans = query(1, 0, n-1);
  push(13, "查询结果 = " + ans, [{t:"segCur", p:0}]);
  return steps;
}

function simTrie(data){

  var nodes = [{ id:0, ch:"", parent:-1 }];

  for(var w=0; w<words.length; w++){

      var c = word[i];

      for(var k=1;k<nodes.length;k++) if(nodes[k].parent === p && nodes[k].ch === c){ child = nodes[k]; break; }
      if(child){
        push(5, "已经有 '" + c + "' 这个孩子（节点 " + child.id + "），直接复用");
        p = child.id;

        tot++;

             [{t:"trieNode", id:tot, ch:c, parent:p}]);

function simBell(g){

function simScc(g){
  var steps = [];
  function push(line, note, events){ steps.push({line:line, note:note||"", events:events||[]}); }
  var n = g.n, adj = {};
  for(var v=1; v<=n; v++) adj[v] = [];
  for(var k=0; k<g.edges.length; k++) adj[g.edges[k][0]].push(g.edges[k][1]);

  var dfn = {}, low = {}, inst = {}, stk = [], timer = 0, comp = 0;
  for(var v=1; v<=n; v++){ dfn[v] = 0; low[v] = 0; inst[v] = 0; }

  push(0, "dfn 是第一次访问的时间戳，low 是能绕回的最早时间戳", []);

  function dfs(u){
    timer++;
    dfn[u] = low[u] = timer;
    inst[u] = 1; stk.push(u);
    push(4, "访问 " + u + "：dfn = low = " + timer + "，压入栈",
         [{t:"dist", u:u, val:timer}, {t:"low", u:u, v:timer}, {t:"spush", u:u}, {t:"cur", u:u}]);
    var list = adj[u] || [];
    for(var i=0; i<list.length; i++){
      var v2 = list[i];
      if(!dfn[v2]){
        push(7, u + " → " + v2 + " 还没访问过，递归下去", [{t:"hi", u:u, v:v2}]);
        dfs(v2);
        low[u] = Math.min(low[u], low[v2]);
        push(7, "回到 " + u + "，low[" + u + "] = min(low, low[" + v2 + "]) = " + low[u],
             [{t:"low", u:u, v:low[u]}]);
      }else if(inst[v2]){
        low[u] = Math.min(low[u], dfn[v2]);
        push(8, u + " → " + v2 + " 还在栈里，low[" + u + "] = min(low, dfn[" + v2 + "]) = " + low[u],
             [{t:"hi", u:u, v:v2}, {t:"low", u:u, v:low[u]}]);
      }
    }
    if(low[u] === dfn[u]){
      push(10, "low[" + u + "] = dfn[" + u + "]：u 是一个强连通分量的根，开始弹栈",
           [{t:"cur", u:u}]);
      while(true){

      push(10, "第 " + comp + " 个强连通分量确定，共 " + comp + " 个");
    }

  for(var s=1; s<=n; s++) if(!dfn[s]) dfs(s);

}

function simFlow(g){
  var steps = [];
  function push(line, note, events){ steps.push({line:line, note:note||"", events:events||[]}); }
  var n = g.n, s = 1, t = n;
  var cap = {}, flow = {}, adj = {};
  for(var v=1; v<=n; v++) adj[v] = [];
  for(var k=0; k<g.edges.length; k++){
    var e = g.edges[k], key = edgeKey(e[0], e[1]);
    cap[key] = e[2]; flow[key] = 0;
    adj[e[0]].push({ v:e[1], key:key });
  }
  var total = 0;

  push(0, "每条边有容量，初始流量都是 0", []);
  push(1, "反复找「还能再推流」的路径，直到找不到");

  while(true){
    var pre = {}, seen = {};
    for(var v=1; v<=n; v++) pre[v] = -1;
    var q = [s];
    seen[s] = true;
    push(2, "BFS 从源点 " + s + " 出发，找一条到汇点 " + t + " 的增广路");
    while(q.length){
      var u = q.shift();
      push(5, "从 " + u + " 往外扩");
      var list = adj[u] || [];
      for(var i=0; i<list.length; i++){
        var v2 = list[i].v, k2 = list[i].key;
        if(!seen[v2] && cap[k2] - flow[k2] > 0){
          seen[v2] = true; pre[v2] = u; q.push(v2);
          push(8, "边 " + u + " → " + v2 + " 还剩 " + (cap[k2] - flow[k2]) + " 的容量，记下前驱",
               [{t:"hi", u:u, v:v2}]);
        }
      }
    }
    if(!seen[t]){
      push(11, "BFS 到不了汇点，没有增广路了，结束");
      break;
    }
    var add = Infinity, path = [];
    for(var v2=t; v2!==s; v2=pre[v2]) path.push([pre[v2], v2]);
    path.reverse();
    for(var i=0; i<path.length; i++){
      var kk = edgeKey(path[i][0], path[i][1]);
      add = Math.min(add, cap[kk] - flow[kk]);
    }
    var names = [];
    for(var i=0; i<path.length; i++) names.push(path[i][0] + "→" + path[i][1]);
    push(13, "找到增广路 " + names.join("，") + "，瓶颈是 " + add, []);

    for(var i=0; i<path.length; i++){
      var u2 = path[i][0], v3 = path[i][1], k3 = edgeKey(u2, v3);
      flow[k3] += add;
      push(16, "边 " + u2 + "→" + v3 + " 流量 +" + add + "，变成 " + flow[k3] + "/" + cap[k3],
           [{t:"flow", u:u2, v:v3, f:flow[k3]}]);
    }
    total += add;
    push(18, "这一轮推了 " + add + "，累计最大流 " + total, [{t:"mflow", v:total}]);
  }
  push(18, "结束，最大流 = " + total, [{t:"mflow", v:total}, {t:"cur", u:0}]);
  return steps;
}

function simDsu(g){

  var fa = {}, sz = {};
  for(var i=1; i<=n; i++){ fa[i] = i; sz[i] = 1; }
  function find(x){
    while(fa[x] !== x){ fa[x] = fa[fa[x]]; x = fa[x]; }
    return x;
  }
  function paint(){
    var evs = [];
    for(var x=1; x<=n; x++) evs.push({t:"color", u:x, c:find(x) - 1});
    return evs;
  }
  push(0, "每个人一开始各自一伙，fa[i] = i", [{t:"dsuInit", n:n}]);
  push(1, "初始化：fa[i] = i", paint());

  for(var k=0; k<edges.length; k++){
    var u = edges[k][0], v = edges[k][1];
    push(6, "把 " + u + " 和 " + v + " 并到一起", [{t:"hi", u:u, v:v}]);
    var ru = find(u), rv = find(v);
    push(2, "find(" + u + ") = " + ru + "，find(" + v + ") = " + rv, [{t:"cur", u:u}]);
    if(ru === rv){
      push(8, "它们本来就在同一伙，不用合并");
    }else{
      if(sz[ru] < sz[rv]){ var t = ru; ru = rv; rv = t; }
      fa[rv] = ru; sz[ru] += sz[rv];
      push(11, "小团体挂到大团体下：fa[" + rv + "] = " + ru + "，人数 " + sz[ru],
           [{t:"hi", u:ru, v:rv}, {t:"setParent", x:rv, p:ru}, {t:"setSize", x:ru, s:sz[ru]}]);
      push(11, "重新给同一伙的人上同一种颜色", paint());
    }
  }
  var roots = {};
  for(var x=1; x<=n; x++) roots[find(x)] = 1;
  push(11, "最后分成 " + Object.keys(roots).length + " 伙", [{t:"cur", u:0}]);
  return steps;
}
